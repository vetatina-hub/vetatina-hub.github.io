@keyframes breathe{0%{transform:scale(1)}100%{transform:scale(1.08)}}
#stars{position:fixed;inset:0;z-index:0}
.neb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18;mix-blend-mode:screen;z-index:0;animation:drift 26s ease-in-out infinite alternate}
.neb.a{width:420px;height:420px;background:#5b2cff;top:-120px;left:-140px}
.neb.b{width:380px;height:380px;background:#ff3d9a;bottom:-140px;right:-120px;animation-duration:32s;opacity:.3}
.neb.c{width:300px;height:300px;background:#1fa0ff;top:40%;left:55%;animation-duration:22s;opacity:.28}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.15)}100%{transform:translate(-30px,50px) scale(.95)}}
.glyph{position:fixed;top:0;z-index:1;color:#ffd978;font-family:Georgia,serif;font-weight:bold;pointer-events:none;text-shadow:0 0 12px rgba(255,200,90,.9),0 0 26px rgba(255,170,60,.5);animation:floatUp linear infinite;will-change:transform}
.glyph.e{text-shadow:0 0 14px rgba(255,200,90,.7)}
@keyframes floatUp{0%{transform:translate(0,110vh) rotate(0);opacity:0}8%{opacity:var(--o)}50%{transform:translate(var(--dx),45vh) rotate(180deg)}92%{opacity:var(--o)}100%{transform:translate(0,-15vh) rotate(360deg);opacity:0}}
#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:16px 14px 90px;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:normal;margin:.2em 0 .4em}
h1{font-size:34px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold2),var(--gold),#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:25px;color:var(--gold2)}
h3{font-size:19px;color:var(--gold)}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.glow{box-shadow:0 0 0 1px rgba(232,197,106,.35),0 0 30px rgba(123,92,255,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:600;cursor:pointer;color:#1b1430;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#d99a3c);box-shadow:0 6px 24px rgba(232,197,106,.35);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.w{width:100%}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
input,textarea,select{width:100%;background:rgba(5,8,30,.7);border:1px solid rgba(154,163,208,.3);color:var(--txt);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(154,163,208,.3);font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:linear-gradient(135deg,rgba(232,197,106,.35),rgba(123,92,255,.35));border-color:var(--gold);color:#fff}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(154,163,208,.18);margin:7px 0;animation:pop .35s}
.item .grow{flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis}
.x{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,122,138,.4);background:transparent;color:var(--bad);font-size:16px;cursor:pointer;flex:none}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.big{font-family:Georgia,serif;font-size:38px;color:var(--gold2);text-align:center;margin:6px 0}
.center{text-align:center}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin:-16px -14px 6px;background:linear-gradient(180deg,rgba(5,8,23,.95),rgba(5,8,23,.6));backdrop-filter:blur(8px);font-size:13px;color:var(--mut)}
.timer{color:var(--gold);font-weight:600}
.photo{width:170px;height:170px;border-radius:50%;margin:10px auto;position:relative;background:conic-gradient(from 0deg,#fff1b8,var(--gold),#a8741f,var(--gold),#fff1b8);padding:3px;box-shadow:0 0 40px rgba(255,190,80,.55);animation:spin 12s linear infinite}
.photo>div{width:100%;height:100%;border-radius:50%;background:#0b1030 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:46px;color:var(--gold);animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{position:relative;width:290px;height:290px;margin:0 auto}
.orbit .ring{position:absolute;inset:0;border:1px dashed rgba(232,197,106,.25);border-radius:50%;animation:spin 40s linear infinite}
.orbit .ring i{position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px var(--gold)}
.orbit .photo{position:absolute;inset:28px;margin:0;width:auto;height:auto}
/* map */
.map{position:relative;padding:10px 0}
.node{display:flex;align-items:center;gap:12px;margin:0 0 4px;cursor:pointer}
.node.r{flex-direction:row-reverse;text-align:right}
.planet{width:62px;height:62px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;color:#fff;background:radial-gradient(circle at 30% 30%,#8f7bff,#2a1f7a 70%);box-shadow:0 0 22px rgba(123,92,255,.55);position:relative}
.node.done .planet{background:radial-gradient(circle at 30% 30%,#ffe9a6,#b8862e 70%);color:#2a1a00;box-shadow:0 0 26px rgba(232,197,106,.7)}
.node.cur .planet{animation:pulse 1.6s infinite}
.node.lock .planet{background:radial-gradient(circle at 30% 30%,#3a3f63,#151935 70%);box-shadow:none;color:#6b7199}
.node.soon .planet{background:radial-gradient(circle at 30% 30%,#2c4a66,#0f2034 70%);box-shadow:none;color:#7fa7c9;font-size:15px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,197,106,.7)}70%{box-shadow:0 0 0 18px rgba(232,197,106,0)}100%{box-shadow:0 0 0 0 rgba(232,197,106,0)}}
.node .t{flex:1;padding:10px 12px;border-radius:14px;background:rgba(18,24,58,.55);border:1px solid rgba(154,163,208,.15)}
.node .t b{display:block;font-size:15px}
.node .t span{font-size:12px;color:var(--mut)}
.trail{width:2px;height:22px;margin:0 auto;background:linear-gradient(var(--gold),transparent);opacity:.5}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:99px;transition:width .6s}
.idea{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:10px 0}
.quote{font-family:Georgia,serif;font-style:italic;color:var(--gold2);text-align:center;padding:10px;font-size:17px}
.audio{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(123,92,255,.25),rgba(255,111,181,.15));border:1px solid rgba(123,92,255,.4)}
.audio .ic{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#221;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
audio{width:100%;margin-top:8px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(123,92,255,.3);color:#d8d0ff;margin-right:4px}
.zone{border-radius:16px;padding:10px;margin:8px 0;border:1px dashed rgba(154,163,208,.3)}
.seg{display:flex;gap:4px;margin-top:6px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;border:1px solid rgba(154,163,208,.3);background:transparent;color:var(--mut);font-size:12px;cursor:pointer}
.seg button.on{background:var(--gold);color:#221;border-color:var(--gold);font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.closed b{text-decoration:line-through;opacity:.6}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table td,.table th{padding:8px 6px;border-bottom:1px solid rgba(154,163,208,.15);text-align:left}
.table td:first-child{white-space:nowrap}
.table th{color:var(--gold);font-weight:600;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;margin:10px 0}
.bars div{flex:1;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--gold),var(--violet));position:relative;transition:height .6s;min-height:4px}
.bars div span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--gold2)}
.scale{display:flex;gap:10px;margin:10px 0}
.scale>div{flex:1;border-radius:16px;padding:12px;text-align:center}
.ringbtn{width:190px;height:190px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,serif;font-size:19px;color:#221;cursor:pointer;user-select:none;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gold) 60%,#b07a26);box-shadow:0 0 40px rgba(232,197,106,.6);transition:transform .1s;padding:20px}
.ringbtn:active{transform:scale(.93)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;cursor:pointer}
.check .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;color:#221;font-weight:800}
.check.on .box{background:var(--gold)}
.flip{perspective:800px;height:130px;margin:10px 0;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.flip .f{background:linear-gradient(135deg,rgba(123,92,255,.45),rgba(31,160,255,.25));border:1px solid rgba(123,92,255,.6);font-family:Georgia,serif;font-size:20px}
.flip .bk{transform:rotateY(180deg);background:rgba(232,197,106,.15);border:1px solid var(--gold)}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.fixedbot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 14px 14px;background:linear-gradient(0deg,rgba(5,8,23,.98),rgba(5,8,23,.7));}
.fixedbot>div{max-width:560px;margin:0 auto}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1d2250;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%;text-align:center;animation:pop .3s}
.phrase{padding:14px;border-radius:14px;margin:8px 0;text-align:center;font-family:Georgia,serif;font-size:17px;background:rgba(255,255,255,.04);border:1px solid rgba(154,163,208,.2);cursor:pointer;transition:all .4s}
.phrase.hid{color:transparent;text-shadow:0 0 12px rgba(232,197,106,.7)}
.phrase.on{border-color:var(--gold);background:rgba(232,197,106,.12);color:var(--gold2)}
.medtext{max-height:0;overflow:hidden;transition:max-height .5s}
.medtext.on{max-height:9000px}
.small{font-size:13px}
</style>
</head>

function migrate(s){/* старые долги без кредитора — раскладываем по кредиторам */s.debts.forEach(d=>{if(d.credId)return;let c=s.creds.find(c=>c.name.toLowerCase()==String(d.name).toLowerCase());if(!c){c={id:Math.random().toString(36).slice(2,9),name:d.name,kind:/долг (родств|знаком)/i.test(d.type)?"person":"bank"};s.creds.push(c)}d.credId=c.id;d.cname=c.name})}

function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;s=s.trim().toUpperCase();for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

function dateIn(days){const d=new Date();d.setDate(d.getDate()+Math.ceil(days));return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})}
function dur(days){days=Math.ceil(days);if(days<=0)return"сразу";const y=Math.floor(days/365),m=Math.floor(days%365/30),d=days%365%30;let p=[];if(y)p.push(y+" "+pl(y,"год","года","лет"));if(m)p.push(m+" "+pl(m,"месяц","месяца","месяцев"));if(d&&!y)p.push(d+" "+pl(d,"день","дня","дней"));return p.join(" ")||"меньше дня"}
function pl(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1==1)return a;return c}

{n:0,t:"Правила курса",s:"Вход в систему",
 idea:`<p>За эти уроки вы пройдёте путь от финансового хаоса к ясности, порядку и контролю.</p><div class="idea">✍️ <b>Заведите тетрадь</b> для этого курса. После каждого урока записывайте от руки главную мысль и своё действие — так нейроны запоминают новое, и оно становится привычкой.</div><p class="quote">«Знания без действий ничего не меняют — меняет только практика»</p>`,
 tool(){const R=[["Не перескакиваем уроки","Каждый урок — фундамент для следующего. Система работает только целиком."],["Не пропускаем задания","Задание — обязательная часть. В выполнении — реальные изменения."],["Не переделываем под себя","Доверяйте системе. Сила — в точном выполнении."]];
  return `<h3>Переверните каждое правило</h3>`+R.map((r,i)=>`<div class="flip ${S.checks["r"+i]?"on":""}" onclick="A.flip(${i})"><div class="in"><div class="f">${i+1}. ${r[0]}</div><div class="bk">${r[1]}<div class="mut" style="margin-top:6px">✓ принято</div></div></div></div>`).join("")+
  `<h3 style="margin-top:18px">Ваше слово</h3><p class="mut">Удерживайте кнопку 3 секунды</p><button class="btn w hold" id="oath" ${S.checks.oath?"disabled":""}><i></i><span>${S.checks.oath?"✓ Я иду до конца":"Я иду до конца"}</span></button>`},
 after(){holdBtn("oath",3000,()=>{S.checks.oath=1;save();burst(60);rer()})},
 ok:()=>[0,1,2].every(i=>S.checks["r"+i])&&S.checks.oath||"Переверните 3 правила и дайте слово"},

{n:1,t:"Финансовая честность",law:["Ваше место и деньги",`<p>Долги — это не только цифры. То, на каком месте вы стоите в своей семье и роду, напрямую влияет на деньги: на чужом месте они не задерживаются.</p><p>Честный взгляд на свои долги — первый шаг, чтобы это увидеть.</p>`],s:"Первый шаг к деньгам — честность",
 idea:`<div class="idea" style="border-color:var(--gold)"><b>Самая важная мысль.</b> Никто за вас ничего не сделает — ни коуч, ни психолог, ни наставник. Только ваши действия решают вашу жизнь. Специалист даёт путь — идёте вы сами.</div><p>Пока всё в голове — там хаос. Когда выписываешь — появляется контроль.</p><div class="idea"><b>Всё, что оформлено на вас — ваш долг.</b> Даже если брали для мужа, родителей, детей, бизнеса. И всё, что вы платите, даже если оформлено не на вас.</div>`,
 tool(){const total=totalDebt();
  return `<div class="seg" style="margin-bottom:10px"><button class="${!S.noDebts?"on":""}" onclick="A.set('noDebts',false)">У меня есть долги</button><button class="${S.noDebts?"on":""}" onclick="A.set('noDebts',true)">Долгов нет</button></div>`+
  (S.noDebts?dreamsUI():`
  <h3>Шаг 1. Кому вы должны?</h3><p class="mut small">Добавьте каждый банк, организацию и <b>каждого человека отдельно, по имени</b>. Их может быть 10–15 и больше — это нормально.</p>
  <div class="row"><input id="cname" placeholder="${{bank:"Название банка: Kaspi, Halyk, Forte…",org:"Название: МФО, магазин, КСК…",person:"Имя: тётя Айгуль, Марат…"}[S.texts.ckind||"bank"]}"></div>
  <div class="seg" id="ckind"><button class="${(S.texts.ckind||"bank")=="bank"?"on":""}" onclick="A.ckind('bank')">🏦 Банк</button><button class="${S.texts.ckind=="org"?"on":""}" onclick="A.ckind('org')">🏢 Организация</button><button class="${S.texts.ckind=="person"?"on":""}" onclick="A.ckind('person')">👤 Человек</button></div>
  <button class="btn w" style="margin-top:10px" onclick="A.addCred()">＋ Добавить</button>
  <div class="card glow center" style="margin-top:16px"><div class="mut">Общая сумма долгов</div><div class="big" id="tot">${fmt(total)}</div><div class="mut">${S.creds.length} ${pl(S.creds.length,"кредитор","кредитора","кредиторов")} · ${S.debts.length} ${pl(S.debts.length,"позиция","позиции","позиций")}</div></div>
  ${S.creds.length?`<h3>Шаг 2. Что у вас в каждом из них?</h3><p class="mut small">В одном банке может быть и кредит, и рассрочка, и карта — добавьте каждую позицию отдельно.</p>`:""}
  ${S.creds.map(c=>credCard(c)).join("")}
  <h3 style="margin-top:16px">Три запрета</h3>${["Я ничего не скрыла","Я не уменьшила","Я не округлила"].map((t,i)=>chk("ch1_"+i,t)).join("")}`)},
 ok:()=>S.noDebts?(S.dreams.length>=1||"Добавьте хотя бы одну мечту или цель"):(S.debts.length<1?"Добавьте кредитора и хотя бы одну позицию":S.creds.some(c=>!S.debts.some(d=>d.credId==c.id))?"У каждого кредитора добавьте позицию с суммой (или удалите лишнего)":[0,1,2].every(i=>S.checks["ch1_"+i])||"Отметьте три запрета")},

{n:2,t:"Договариваемся с кредиторами",faq:[["Нет контакта — что делать?","Долг фиксируете. Пишете письмо с намерением: готовы вернуть, если человек появится."],["Человек умер?","Делаете благотворительность или доброе действие с посылом «я возвращаю»."],["Кредит на мне, а платит муж?","Оформлен на вас — значит, ваш долг юридически. Фиксируете, не уходите в игнор."],["Посредничество — это мой долг?","Нет, если вы не брали деньги, не обещали и не подписывали."],["Мне стыдно говорить","Это не стыд — это обязательство. «Я должна, давай договоримся, вот срок»."],["Рассрочки — это долги?","Да. Кредиты, рассрочки, карты — всё фиксируется. Это ваши обязательства."]],s:"Дата, сумма, срок",
 idea:`<p>Договорённость снимает напряжение — избегание его усиливает. Вы сами начинаете разговор и предлагаете план.</p><div class="idea">Стыдно — это не стыд, а обязательство: «Я должна, давай договоримся, вот срок».</div>
 <h3>Письмо кредитору: как написать грамотно и сильно</h3>
 <p>Если позвонить страшно или человек не берёт трубку — пишем письмо. Письмо показывает: вы не прячетесь, вы помните и возвращаете. Сильное письмо держится на шести правилах:</p>
 <div class="idea">1. <b>Признайте долг и точную сумму.</b> Без «примерно» и без уменьшения.<br>2. <b>Без оправданий и жалоб.</b> Одна фраза о ситуации — не больше.<br>3. <b>Конкретный план:</b> сколько и когда вы возвращаете, и дата полного закрытия.<br>4. <b>Первый платёж — сразу.</b> Даже маленький. Это доказательство слов.<br>5. <b>Попросите подтвердить</b>, что вам так удобно — или предложить свой вариант.<br>6. <b>Сохраните копию</b> письма и ответа.</div>
 <p class="mut small">Банку и МФО пишем официально — через приложение, сайт или в отделении: просим отсрочку или реструктуризацию и прикладываем свой план. Человеку можно написать в WhatsApp — по тем же правилам.</p>`,
 tool(){if(S.noDebts||!S.debts.length)return `<p class="mut">У вас нет долгов в списке — этот шаг пропускаем.</p>`;const c=S.debts.filter(d=>d.st2).length;
  const lt=`<p class="mut small">Под каждым долгом есть кнопка «📋 Готовое письмо» — письмо соберётся с вашей суммой. Допишите план и отправьте.</p>`;
  return lt+`<h3>Свяжитесь с каждым</h3><div class="prog"><i style="width:${c/S.debts.length*100}%"></i></div><p class="mut">${c} из ${S.debts.length}</p>`+
  S.debts.map(d=>`<div class="item" style="flex-wrap:wrap"><div class="grow"><b>${esc(d.name)}</b><span class="mut small">${fmt(d.sum)}</span><div class="seg"><button class="${d.st2=="call"?"on":""}" onclick="A.edit('${d.id}','st2','call')">Связалась</button><button class="${d.st2=="deal"?"on":""}" onclick="A.edit('${d.id}','st2','deal')">Договорились</button><button class="${d.st2=="letter"?"on":""}" onclick="A.edit('${d.id}','st2','letter')">Письмо</button></div><button class="btn sm ghost" style="margin-top:6px" onclick="A.letter('${d.id}')">📋 Готовое письмо</button>${d.st2=="deal"?`<div class="row" style="margin-top:6px"><input type="date" value="${d.agreeDate||""}" onchange="A.edit('${d.id}','agreeDate',this.value)" style="padding:8px"><input inputmode="numeric" placeholder="сумма" value="${num(d.agreeSum)||""}" onchange="A.edit('${d.id}','agreeSum',this.value)" style="padding:8px"></div>`:""}</div></div>`).join("")+
  `<div class="card"><h3>Готовая фраза</h3><p class="quote" style="font-size:15px">«Здравствуйте! Я помню про свой долг ${"[сумма]"}. Хочу договориться: могу вернуть до ${"[дата]"}, частями по ${"[сумма]"}. Вам так удобно?»</p></div>`},
 ok:()=>(S.noDebts||!S.debts.length)||S.debts.every(d=>d.st2)||"Отметьте разговор с каждым кредитором"},

{n:3,t:"Те, кто должен вам",faq:[["Человек игнорирует","Долг есть — вы его фиксируете. Спокойно напоминаете, обозначаете сумму, ставите срок."],["Мне неудобно напоминать","Это не про «неудобно» — это про вашу позицию. Долг — обязательство. Вы имеете право его обозначить."],["Говорит «позже», «нет денег»","Не уходите в ожидание. Фиксируете конкретный срок и конкретную сумму. Без срока долг = бесконечность."],["Хочу обнулить — нет сил","Нельзя из слабости — это нарушение баланса. Можно пересогласовать сроки, но не обнулять."],["Человек в тяжёлой ситуации","Сочувствие — да. Обнуление — нет. Иначе вы тянете за него, а он не несёт ответственность."],["Сумма небольшая — не трогать?","Дело не в сумме, а в позиции. Если не обозначаете — система фиксирует «можно не возвращать»."],["Как правильно говорить?","Спокойно и чётко: «Напоминаю, у тебя есть задолженность…», «Давай договоримся о сроке…»"],["Человек «забыл»","Это не случайность — это отражение вашей позиции. Не проявились → забыли. Проявились → вспомнили."],["Писать письмо?","Да. Оно завершает внутреннюю зацепку и возвращает вашу энергию. Но не отменяет реальный долг."],["Есть договор или суд","Обнулять нельзя. Действуете через систему: договор, закон."],["Когда можно «отпустить» долг?","Только если вы в силе и не зависите от этих денег. Не из боли и не из усталости."]],law:["Давать и брать",`<p>Когда человек много даёт и не умеет брать — прощает долги, не напоминает, раздаёт, — деньги начинают уходить к другим и не возвращаются.</p><p>Это видно не только в деньгах, но и в паре, и на работе.</p>`],s:"Спокойствие и чёткость",
 idea:`<p class="quote">«Это мои заработанные деньги. Я дала тебе кусочек своей жизни — верни мой кусочек жизни»</p><div class="idea">Не молчите — иначе закрепляется «можно не платить». Без эмоций, без стыда, без агрессии. Обнулять из слабости нельзя — можно пересогласовать сроки. <b>Больше в долг не даём.</b></div>`,
 tool(){return chk("nobody","Мне никто не должен")+(S.checks.nobody?"":`
  <h3>Кто вам должен</h3><div class="row"><input id="orn" placeholder="Имя"><input id="ors" inputmode="numeric" placeholder="Сумма"></div><button class="btn w" style="margin-top:8px" onclick="A.addDebtor()">＋ Добавить</button>
  <div class="card center"><div class="mut">Вам должны</div><div class="big">${fmt(S.debtors.reduce((a,d)=>a+num(d.sum),0))}</div></div>
  ${S.debtors.map(d=>`<div class="item" style="flex-wrap:wrap"><div class="grow"><b>${esc(d.name)} · ${fmt(d.sum)}</b><div class="seg"><button class="${d.st=="rem"?"on":""}" onclick="A.edOr('${d.id}','st','rem')">Напомнила</button><button class="${d.st=="deal"?"on":""}" onclick="A.edOr('${d.id}','st','deal')">Есть дата</button><button class="${d.st=="letter"?"on":""}" onclick="A.edOr('${d.id}','st','letter')">Письмо</button><button class="${d.st=="back"?"on":""}" onclick="A.edOr('${d.id}','st','back')">Вернули!</button></div>${d.st=="deal"?`<input type="date" value="${d.date||""}" onchange="A.edOr('${d.id}','date',this.value)" style="margin-top:6px;padding:8px">`:""}<button class="btn sm ghost" style="margin-top:8px" onclick="A.copyOr('${d.id}')">📋 Скопировать сообщение</button></div><button class="x" onclick="A.delOr('${d.id}')">✕</button></div>`).join("")}`)},
 ok:()=>S.checks.nobody||(S.debtors.length&&S.debtors.every(d=>d.st))||"Добавьте должников и отметьте разговор с каждым"},

{n:4,t:"С мелкого к крупному",s:"Техника жизни без долгов",
 idea:`<p>Первые закрытые долги дают ощущение «я могу». Именно мелкие долги чаще всего держат в состоянии «я должна».</p><div class="idea">Налоги — это расходы, не долги.</div>`,
 tool(){const ds=openDebts();if(ds.length<2)return `<p class="mut">Сортировать нечего — идём дальше.</p>`;
  if(!S.shuf4.length||S.shuf4.length!=ds.length){S.shuf4=ds.map(d=>d.id).sort(()=>Math.random()-.5);S.picked4=[];save()}
  const left=S.shuf4.filter(id=>!S.picked4.includes(id)).map(id=>S.debts.find(d=>d.id==id)).filter(Boolean);
  return `<h3>Игра: нажимайте долги от самого маленького к самому большому</h3><div class="prog"><i style="width:${S.picked4.length/ds.length*100}%"></i></div>`+
  (left.length?left.map(d=>`<div class="item" id="p${d.id}" style="cursor:pointer" onclick="A.pick('${d.id}')"><div class="grow"><b>${esc(d.name)}</b></div><b style="color:var(--gold2)">${fmt(d.sum)}</b></div>`).join(""):"")+
  (S.picked4.length?`<h3 style="margin-top:14px">Ваш новый порядок</h3>`+S.picked4.map((id,i)=>{const d=S.debts.find(x=>x.id==id);return d?`<div class="item"><div class="planet" style="width:34px;height:34px;font-size:14px">${i+1}</div><div class="grow"><b>${esc(d.name)}</b></div><b>${fmt(d.sum)}</b></div>`:""}).join(""):"")+
  (!left.length?`<p class="quote">1 долг — погасили полностью → 2 → 3… Пока не закроете все долги — роста в масштаб не будет!</p><button class="btn sm ghost" onclick="A.reset4()">↺ Пройти заново</button>`:"")},
 ok:()=>openDebts().length<2||S.picked4.length>=openDebts().length||"Расставьте все долги по порядку"},

{n:5,t:"Приоритеты долгов",s:"По срокам и договорённостям",
 idea:`<p>«По важности» — это не про сумму, а про сроки и договорённости.</p><div class="idea">Выстраиваем не по страху, а по реальным обязательствам. Не «кого боюсь», а «где договорённость».</div>`,
 tool(){const ds=openDebts();if(!ds.length)return `<p class="mut">Нет долгов — идём дальше.</p>`;
  return `<button class="btn sm ghost" onclick="A.autoZone()">✨ Подсказать по срокам</button>`+ds.map(d=>`<div class="item" style="flex-wrap:wrap"><div class="grow"><b>${esc(d.name)} · ${fmt(d.sum)}</b><span class="mut small">${d.due?"срок: "+new Date(d.due).toLocaleDateString("ru-RU"):"срок не указан"}${d.st2=="deal"?" · есть договорённость":""}</span><div class="seg"><button class="${d.zone=="start"?"on":""}" onclick="A.edit('${d.id}','zone','start')">🔥 Начало</button><button class="${d.zone=="mid"?"on":""}" onclick="A.edit('${d.id}','zone','mid')">Середина</button><button class="${d.zone=="end"?"on":""}" onclick="A.edit('${d.id}','zone','end')">Конец</button></div></div></div>`).join("")+
  `<h3 style="margin-top:14px">Ваш список по важности</h3>`+priority().filter(d=>!d.closed&&d.zone).map((d,i)=>`<div class="item"><div class="planet" style="width:34px;height:34px;font-size:14px">${i+1}</div><div class="grow"><b>${esc(d.name)}</b><span class="mut small">${{start:"начало",mid:"середина",end:"конец"}[d.zone]}</span></div><b>${fmt(d.sum)}</b></div>`).join("")},
 ok:()=>openDebts().every(d=>d.zone)||"Распределите каждый долг"},

{n:6,t:"Накопление на закрытие долгов",s:"Фокус — на комфортной сумме каждый день",
 idea:`<p>Не важно, как приходят деньги — раз в месяц или частями. Важно поведение: получили → сразу отложили часть → разбили на каждый день.</p><p class="quote">Даже 100 ₸ каждый день лучше, чем 50 000 один раз и потом хаос</p>
 <h3>В чём сила этого урока</h3>
 <div class="idea"><b>Фокус не на дате, а на комфортной сумме, которую вы откладываете каждый день.</b><br>Берёте первый долг → выбираете комфортную сумму → видите, к какому сроку закроете. Потом второй, третий — и так весь список.</div>
 <div class="idea"><b>Почему каждый день:</b> есть внимание, есть управление, есть привычка. Деньги идут туда, где есть внимание, — и поток стабилизируется.</div>
 <p class="small"><b>Примеры:</b> 458 000 ₸ : 2 000 ₸ в день = 229 дней. 1 200 000 ₸ : 3 000 ₸ = 400 дней — больше года, и это нормально. 30 000 ₸ : 3 500 ₸ = 9 дней.</p>`,
 tool(){const ds=priority().filter(d=>!d.closed),T=totalDebt();if(!ds.length)return dreamsCalc();
  const amts=[100,200,500,1000,2000,3000,5000,10000];
  const sumDaily=ds.reduce((a,d)=>a+num(d.daily),0);
  return `<div class="card glow"><h3>Если откладывать каждый день…</h3><p class="mut">весь долг ${fmt(T)} закроется:</p><table class="table"><tr><th>В день</th><th>Срок</th><th>Дата</th></tr>${amts.map(a=>`<tr><td><b>${fmt(a)}</b></td><td>${dur(T/a)}</td><td class="mut">${dateIn(T/a)}</td></tr>`).join("")}</table>
  <label>Своя сумма в день</label><input id="cust" inputmode="numeric" placeholder="например 1500" oninput="A.cust(this.value)"><div id="custR" class="center" style="margin-top:8px"></div></div>
  <h3>Теперь по каждому долгу — своя комфортная сумма</h3>`+
  ds.map(d=>{const dl=num(d.daily);return `<div class="item" style="flex-wrap:wrap"><div class="grow"><b>${esc(d.name)} · ${fmt(d.sum)}</b><input type="range" min="100" max="${Math.max(10000,Math.ceil(num(d.sum)/30/100)*100)}" step="100" value="${dl||100}" oninput="A.daily('${d.id}',this.value)" style="padding:0;margin:10px 0"><div class="row"><b style="color:var(--gold2)" id="dl${d.id}">${dl?fmt(dl)+" в день":"двигайте ползунок"}</b><span class="mut small" id="dd${d.id}">${dl?dur(num(d.sum)/dl)+" · до "+dateIn(num(d.sum)/dl):""}</span></div></div></div>`}).join("")+
  `<div class="card center"><div class="mut">Всего откладываю в день</div><div class="big" id="sumd">${fmt(sumDaily)}</div><div class="mut" id="summ">это ${fmt(sumDaily*30)} в месяц</div></div><p class="mut small">Кредит продолжаем платить ежемесячно. Отложенное каждый день — на ежемесячный платёж не тратим.</p>`},
 ok:()=>openDebts().every(d=>num(d.daily)>0)||"Выберите сумму в день для каждого долга"},

{n:7,t:"Фокус и действие",more:`<h3>Главные истины о деньгах</h3><div class="idea">Деньги — это посредник между вами и вашей целью.<br>На деньгах фокус не держим.<br>Не предаём деньги.<br>Деньги приходят только на истинные желания.<br><b>Деньги — это не цель, а путь к цели. Самое главное — поставленная цель.</b></div><p class="small">У каждой суммы есть своё место в квантовом поле: каждая загаданная сумма приходит на цель. Пример из практики: клиентке сделали разбор в квантовом поле на квартиру. У неё было ноль накоплений — а она собрала 4 000 000 ₸ за 2 месяца, потому что деньги пришли на истинное желание.</p><p class="small">Если хочется вложиться — копите <b>отдельные</b> средства. Деньги, отложенные на цель, не трогаем, иначе вы предаёте путь денег.</p>`,s:"Как правильно относиться к деньгам",
 idea:`<p>Список долгов — на видное место. Каждый день смотрите и вычёркивайте закрытые. Появляется азарт и ощущение победы.</p><div class="idea"><b>Отложенные деньги не трогаем.</b> «Я пришла сюда, а ты меня кинула. Я больше к тебе не приду». Форс-мажор — взяли часть, обязательно вернули.</div><p class="quote">Деньги — не цель, а путь к цели</p>`,
 tool(){return `<h3>Ваша стена долгов</h3><p class="mut">Закрыли долг — нажмите «Закрыла»</p>`+priority().map(d=>`<div class="item ${d.closed?"closed":""}"><div class="grow"><b>${esc(d.name)}</b><span class="mut small">${fmt(d.sum)}</span></div><button class="btn sm ${d.closed?"ghost":""}" onclick="A.close('${d.id}')">${d.closed?"↺":"Закрыла ✓"}</button></div>`).join("")+
  `<button class="btn sm ghost" onclick="window.print()">🖨 Распечатать и повесить</button>
  <h3 style="margin-top:16px">Вот так мы предаём деньги</h3><p class="mut small">Отметьте то, что узнали в себе. Честно — это видите только вы.</p>
  ${["Отложила — и потратила на другое","Взяла из отложенного «на время» и не вернула","Дала в долг из отложенных денег","Потратила импульсивно, а потом жалела","Стеснялась брать деньги за свою работу","Говорила «деньги — зло», «богатые нечестные»","Прятала покупки и деньги от себя или близких","Не считала, сколько приходит и уходит"].map((t,i)=>chk("b7_"+i,t)).join("")}
  <h3 style="margin-top:16px">Когда я предавала деньги?</h3>${ta("ins7","Вспомните свою ситуацию: отложила — и потратила, отдала не туда…")}
  <div class="card" style="border-color:rgba(123,92,255,.55);background:linear-gradient(135deg,rgba(123,92,255,.18),rgba(18,24,58,.62))"><b>Почему долги возвращаются, даже когда всё закрыла?</b><p class="small" style="margin:6px 0 0">Бывает: человек закрыл кредит — и через полгода новый. Значит, причина не в учёте. Она глубже — в том, на каком месте вы стоите в своей семье и роду. Это вы видели в игре «Своё место».</p><p class="small" style="margin:6px 0 0">В курсе мы сначала наводим порядок. А глубину — своё место — проходим в <b>Квантовом Взлёте</b>. О нём подробно в конце курса.</p><p class="small" style="margin:8px 0 6px">Пока идёте по урокам — приходите в <b>Пространство Трансформации</b>. Там Венера проводит разборы вживую, и вы можете стать фигурой в чужом разборе и увидеть своё. Бесплатно.</p><a class="btn sm ghost w" href="${CONFIG.SPACE_TG}" target="_blank" rel="noopener" onclick="track('space_click',{from:7})">✨ Войти в Пространство (Telegram)</a></div>`},
 ok:()=>(S.texts.ins7||"").length>=20||"Напишите свои инсайты (хотя бы пару предложений)"},

{n:8,t:"Состояние = деньги",law:["Ваша позиция",`<p>Есть три позиции, в которых человек может стоять по отношению к другим. Из одной деньги приходят, из двух других — утекают или не приходят вовсе.</p><p>Ваше состояние каждый день подсказывает, в какой позиции вы сейчас.</p>`],s:"Внутренний ресурс",
 idea:`<p>В стрессе, усталости, апатии деньги не идут или быстро уходят. В энергии и хорошем настроении появляются движение и возможности.</p><p class="quote">«Деньги подходят только к радостным людям»</p>`,
 tool(){const sug=["Потанцевать","Попрыгать","Встретиться с подругой","Музыка","Прогулка","Дыхательная практика","Уход за собой","Тёплый душ","Чай в тишине","Обнять детей","Поспать днём","Помолиться","Порядок дома","Природа","Смешное видео"];
  return `<h3>10 радостей без денег</h3><div class="chips">${sug.map(t=>`<span class="chip ${S.joy.includes(t)?"on":""}" onclick="A.tog('joy','${t}')">${t}</span>`).join("")}${S.joy.map((t,i)=>sug.includes(t)?"":`<span class="chip on" onclick="S.joy.splice(${i},1);save();rer()">${esc(t)} ✕</span>`).join("")}</div><div class="row"><input id="joyin" placeholder="Своё…"><button class="btn sm" style="flex:none" onclick="A.addTo('joy','joyin')">＋</button></div><p class="mut">${S.joy.length} из 10</p>
  <h3>Ритуал на каждый день</h3>${[["m","Утро"],["d","День"],["e","Вечер"]].map(([k,n])=>`<label>${n}</label><select onchange="A.rit('${k}',this.value)"><option value="">— выберите —</option>${S.joy.map(j=>`<option ${S.rit[k]==j?"selected":""}>${esc(j)}</option>`).join("")}</select>`).join("")}
  <h3 style="margin-top:16px">Как я буду заботиться о себе каждый день</h3>${ta("care8","Уход, сон, вода, порядок…")}<h3 style="margin-top:16px">Когда мозг говорит «не получится»</h3><div class="ringbtn" onclick="A.aff()"><div><div style="font-size:15px">У МЕНЯ ВСЁ ПОЛУЧИТСЯ!</div><div style="font-size:34px" id="affn">${S.aff}</div><div style="font-size:12px">из 100</div></div></div>`},
 ok:()=>S.joy.length<10?"Нужно 10 радостей":!(S.rit.m&&S.rit.d&&S.rit.e)?"Выберите ритуал на утро, день и вечер":S.aff<100?"Скажите «У меня всё получится» 100 раз":true},

{n:9,t:"Ваш реальный доход",s:"Чистый доход, не оборот",
 idea:`<p>Считаем то, что реально остаётся у вас. Не оборот, не деньги бизнеса, не чужие деньги.</p><div class="idea">«У меня 1 млн проходит» — но если остаётся 200 000, ваш доход 200 000. Не приукрашиваем.</div>`,
 tool(){const v=S.inc.map(num),mx=Math.max(...v,1),a=avgInc(),mn=Math.min(...v.filter(x=>x>0));
  return `<h3>Чистый доход за 3 последних месяца</h3>${["Месяц 1","Месяц 2","Месяц 3"].map((m,i)=>`<label>${m}</label><input inputmode="numeric" value="${v[i]||""}" oninput="A.inc(${i},this.value)">`).join("")}
  <div class="bars" id="bars">${v.map(x=>`<div style="height:${x/mx*100}%"><span>${x?fmt(x):""}</span></div>`).join("")}</div>
  <div class="card glow center"><div class="mut">Ваш реальный доход</div><div class="big" id="avg">${fmt(a)}</div><div class="mut" id="mn">${isFinite(mn)?"самый слабый месяц: "+fmt(mn):""}</div></div>
  ${chk("net","Это чистый доход, а не оборот")}<h3>Мой финансовый потолок</h3><input placeholder="Вокруг какой цифры крутится доход?" value="${esc(S.ceiling)}" onchange="A.set('ceiling',this.value,1)">`},
 ok:()=>avgInc()>0&&S.checks.net||"Впишите доход и подтвердите, что он чистый"},

{n:10,t:"Пишем общий расход",more:`<h3>Почему мы сливаем деньги</h3><p>Когда вас «кидают» — значит, вы где-то предаёте себя. Деньги на вашу мечту приходят, а вы их сливаете не туда.</p><p class="small">Ошибка — думать «я и так знаю свои расходы». Пока не выписали — вы не управляете. Из всего списка выделите <b>необходимые</b> расходы — без которых не можете жить. Всё остальное — желания, комфорт, привычки.</p><p class="quote">«Я не должна спрашивать разрешения — это моя жизнь»</p>`,s:"Всё под контроль — без исключений",
 idea:`<p class="quote">«Пока не выписали — вы не управляете»</p><div class="idea">Спонтанные траты — кофе, сладкое, «захотелось» — часто съедают больше всего. <b>В долг не даём и не берём.</b> Хочешь помочь — подари.</div>`,
 tool(){return Object.entries(EXPCAT).map(([k,[n,sug]])=>{const it=S.exp[k]||[],t=it.reduce((a,i)=>a+num(i.sum),0);return `<div class="card"><div class="row"><h3>${n}</h3><b style="flex:none;color:var(--gold2)">${fmt(t)}</b></div><div class="chips">${sug.map(s=>`<span class="chip" onclick="A.expQuick('${k}','${s}')">＋ ${s}</span>`).join("")}</div>${it.map(i=>`<div class="item"><div class="grow"><b>${esc(i.name)}</b><div class="row" style="margin-top:6px"><input inputmode="numeric" value="${num(i.sum)||""}" placeholder="в месяц" onchange="A.expEd('${k}','${i.id}',this.value)" style="padding:8px"><span class="chip ${i.need?"on":""}" style="flex:none" onclick="A.need('${k}','${i.id}')">${i.need?"✓ необходимое":"желание"}</span></div></div><button class="x" onclick="A.expDel('${k}','${i.id}')">✕</button></div>`).join("")}<div class="row"><input id="ex_${k}" placeholder="Своя статья"><button class="btn sm" style="flex:none" onclick="A.expAdd('${k}')">＋</button></div></div>`}).join("")+
  `<div class="card glow center"><div class="mut">Все расходы в месяц</div><div class="big">${fmt(expTotal())}</div><div class="mut">из них необходимые: ${fmt(Object.values(S.exp).flat().filter(i=>i.need).reduce((a,i)=>a+num(i.sum),0))}</div></div><h3>Где утечки? Куда сливаю деньги?</h3>${ta("leaks10","Честно…")}`},
 ok:()=>Object.values(S.exp).flat().filter(i=>num(i.sum)>0).length<5?"Впишите хотя бы 5 расходов с суммой":(S.texts.leaks10||"").length<10?"Напишите про утечки":true},

{n:11,t:"Баланс доходов и расходов",more:`<p class="small"><b>Задание на каждый день:</b> записывайте доходы и расходы. Срежьте лишнее, а разницу — сразу на долги.</p>`,law:["Детское и взрослое",`<p>Когда расходы больше доходов, часто включается детская часть: ждать, что кто-то придёт и решит. Пока она ведёт, деньги не слушаются — сколько бы вы ни зарабатывали.</p>`],s:"Я в плюсе или в минусе?",
 idea:`<p>Расходы не должны превышать доход — это база.</p><div class="idea">В минусе — урезаем лишнее, но не трогаем еду, здоровье, обязательные платежи. В плюсе — разницу не тратим, сразу на долги.</div>`,
 tool(){const inc=avgInc(),ex=expTotal(true),diff=inc-ex,T=totalDebt();
  const cuts=Object.values(S.exp).flat().filter(i=>!i.need&&num(i.sum)>0);
  return `<div class="scale"><div style="background:rgba(95,224,168,.12);border:1px solid rgba(95,224,168,.4)"><div class="mut">Приходит</div><b style="font-size:20px">${fmt(inc)}</b></div><div style="background:rgba(255,122,138,.12);border:1px solid rgba(255,122,138,.4)"><div class="mut">Уходит</div><b style="font-size:20px">${fmt(ex)}</b></div></div>
  <div class="card glow center"><div class="mut">${diff>=0?"Вы в плюсе":"Вы в минусе"}</div><div class="big" style="color:${diff>=0?"var(--ok)":"var(--bad)"}">${diff>=0?"+":"−"}${fmt(Math.abs(diff))}</div>${diff>0&&T?`<p>Если всю разницу направить на долги — <b>${fmt(diff/30)} в день</b>, долги закроются за <b>${dur(T/(diff/30))}</b> — к ${dateIn(T/(diff/30))}</p>`:""}</div>
  ${cuts.length?`<h3>${diff<0?"Срежьте лишнее, чтобы выйти в плюс":"Что ещё можно срезать"}</h3>`+cuts.map(i=>`<div class="item"><div class="grow"><b>${esc(i.name)}</b><span class="mut small">${fmt(i.sum)}</span></div><span class="chip ${S.cut[i.id]?"on":""}" onclick="A.cut('${i.id}')">${S.cut[i.id]?"✂ срезала":"срезать"}</span></div>`).join(""):""}
  ${chk("ch11","Разницу не трачу — сразу направляю на долги")}`},
 ok:()=>S.checks.ch11||"Отметьте решение"},

{n:12,t:"7 идей дохода без вложений",s:"От «экономлю» к «зарабатываю»",
 idea:`<p>У вас уже есть опыт, навыки, знания — просто вы не видите в них деньги.</p><div class="idea">Не «не умею, не могу», а «Я не понимаю, как сделать — что сделать, чтобы понять?»</div><p><b>Не ждите завтра, послезавтра или следующего урока.</b> Деньги можно начать зарабатывать уже сейчас — рядом с домом, простой работой. Это не «стыдно», это движение. А движение даёт новые идеи.</p>`,
 tool(){const pr=["Где я работала и что делала?","Что у меня получается легко?","За что меня хвалят?","Где я помогала людям?","Что могу перепродать?","Какую услугу могу оказать?","О чём могу снимать контент?"];
  const Q=["Посидеть с ребёнком (няня)","Объявление о своей услуге в своём районе","Мыть подъезды","Уборка квартир","Мойка окон","Грузчик (для мужчин)","Курьер / доставка","Выпечка и еда на заказ","Выгул собак","Помощь пожилым соседям","Репетитор для школьников","Мелкий ремонт по дому","Продать ненужные вещи","Подработка в магазине или на рынке"];
  return `<h3>Шаг 1. Что я могу делать уже сейчас</h3><p class="mut small"><b>Обязательно отметьте каждую позицию, которую вы можете делать.</b> Отмеченное сразу попадёт в ваш список идей.</p><div class="chips">${Q.map(q=>`<span class="chip ${S.quick.includes(q)?"on":""}" onclick="A.quick('${q}')">${S.quick.includes(q)?"✓ ":""}${q}</span>`).join("")}</div>
  <h3 style="margin-top:14px">Шаг 2. Мои идеи из опыта — нажмите вопрос и подумайте</h3><div class="chips">${pr.map(p=>`<span class="chip" onclick="document.getElementById('idin').placeholder='${p}';document.getElementById('idin').focus()">${p}</span>`).join("")}</div><div class="row"><input id="idin" placeholder="Моя идея…"><button class="btn sm" style="flex:none" onclick="A.addIdea()">＋</button></div><div class="prog" style="margin-top:10px"><i style="width:${Math.min(1,S.ideas.length/7)*100}%"></i></div><p class="mut">${S.ideas.length} из 7</p>`+
  S.ideas.map((t,i)=>`<div class="item"><span style="cursor:pointer;font-size:22px" onclick="A.fav(${i})">${S.fav.includes(i)?"⭐":"☆"}</span><div class="grow"><b>${esc(t)}</b></div><button class="x" onclick="A.delIdea(${i})">✕</button></div>`).join("")+`<h3>Шаг 3. С чего я начну завтра</h3><p class="mut">Отметьте ⭐ 1–2 идеи, с которых начнёте уже завтра</p>`},
 ok:()=>!S.quick.length?"Отметьте, что вы можете делать уже сейчас":S.ideas.length<7?"Нужно минимум 7 идей":(S.fav.length<1||S.fav.length>2)?"Выберите ⭐ 1–2 идеи":true},

{n:13,t:"ИИ найдёт ваши источники дохода",s:"Нейросеть — ваш личный помощник",
 idea:`<p>Вы уже записали 7 идей сами. Теперь подключаем помощника: нейросеть за минуту увидит в вашем опыте то, что вы сами не замечаете.</p><div class="idea">Подойдёт любая: ChatGPT, Claude, Gemini, Алиса, DeepSeek. Чем честнее и подробнее вы о себе напишете — тем точнее ответ.</div>`,
 tool(){const F=[["city","Город","Астана"],["skills","Что я умею (даже простое)","готовить, считать, шить, объяснять…"],["job","Где работала и кем","продавец, бухгалтер, мама в декрете…"],["ask","С чем ко мне обращаются люди","просят совета, рецепт, помочь с документами…"],["like","Что мне нравится делать","рукоделие, общение, порядок…"],["hours","Сколько часов в день готова уделять","2"],["budget","Сколько могу вложить на старте","0"],["want","Сколько хочу дополнительно в месяц","200 000 ₸"]];
  return `<h3>Шаг 1. Расскажите о себе</h3>`+F.map(([k,n,ph])=>`<label>${n}</label><input value="${esc(S.ai13[k]||"")}" placeholder="${ph}" oninput="A.ai('${k}',this.value)">`).join("")+
  `<div class="card glow" style="margin-top:16px"><h3 style="margin-top:0">Как дальше — по шагам</h3><p class="small" style="margin:0">1. Ниже ваш готовый запрос — он собрался из того, что вы написали.<br>2. Нажмите <b>«📋 Скопировать запрос»</b>.<br>3. Откройте нейросеть, которая вам удобна (кнопки ниже).<br>4. Нажмите в поле для сообщения, <b>вставьте</b> текст (удерживайте палец → «Вставить») и отправьте.<br>5. Когда нейросеть ответит — <b>скопируйте её ответ</b> и вернитесь сюда, в Шаг 3.</p></div>
  <h3 style="margin-top:16px">Шаг 2. Скопируйте свой готовый запрос</h3><div class="card" style="white-space:pre-wrap;font-size:13px;max-height:220px;overflow:auto" id="aip">${esc(aiPrompt())}</div><button class="btn w" onclick="A.copy(aiPrompt())">📋 Скопировать запрос</button><div class="chips" style="margin-top:8px">${[["ChatGPT","https://chatgpt.com"],["Claude","https://claude.ai"],["Gemini","https://gemini.google.com"],["DeepSeek","https://chat.deepseek.com"],["Алиса","https://alice.yandex.ru"]].map(([n,u])=>`<a class="chip" style="color:var(--txt);text-decoration:none" href="${u}" target="_blank" rel="noopener">Открыть ${n} ↗</a>`).join("")}</div><p class="mut small">Откройте любую нейросеть, вставьте запрос и отправьте.</p>
  <h3 style="margin-top:16px">Шаг 3. Вставьте сюда ответ нейросети</h3><p class="mut small">Нажмите в поле ниже, удерживайте палец → «Вставить».</p>${ta("ai13ans","Вставьте ответ целиком…")}
  <h3>Шаг 4. Лучшие идеи — в ваш список</h3><div class="row"><input id="idin13" placeholder="Идея из ответа…"><button class="btn sm" style="flex:none" onclick="A.addIdea13()">＋</button></div><p class="mut small">Сейчас в вашем списке идей: ${S.ideas.length}. Новые идеи пойдут в неделю действий (урок 16).</p>
  <h3>Мой первый шаг завтра</h3><input value="${esc(S.texts.step13||"")}" placeholder="Например: написать 5 знакомым о своей услуге" oninput="S.texts.step13=this.value;save()">`},
 ok:()=>Object.values(S.ai13).filter(v=>String(v).trim()).length<5?"Заполните хотя бы 5 пунктов о себе":(S.texts.ai13ans||"").length<50?"Вставьте ответ нейросети":!(S.texts.step13||"").trim()?"Напишите первый шаг на завтра":true},{n:14,t:"Фокус на доходе, а не на долгах",s:"Держать фокус на долгах — строго запрещено",
 idea:`<p class="quote">На что у нас фокус внимания — то и растёт в квантовом поле</p><p>Этап завершён. Раньше были тревога, хаос, непонимание. Сейчас есть план, структура, контроль. Значит, можно выдохнуть.</p>
 <div class="scale"><div style="background:rgba(255,122,138,.10);border:1px solid rgba(255,122,138,.4);text-align:left"><b>НЕ на</b><p class="small" style="margin:6px 0 0">«как закрыть долги»<br>«где взять деньги»</p></div><div style="background:rgba(95,224,168,.10);border:1px solid rgba(95,224,168,.4);text-align:left"><b>А на</b><p class="small" style="margin:6px 0 0">список 7+ идей<br>действия по заработку<br>новые возможности<br>«что я сегодня сделала, чтобы заработать»</p></div></div>
 <div class="idea">Долги закрываются не мыслями, а доходом. Если продолжать думать о долгах — застрянете. Если переключиться на действия — доход начнёт расти.</div>`,
 tool(){return `<h3>Переключаю фокус</h3><p class="mut">Удерживайте кнопку 3 секунды</p><button class="btn w hold" id="say14" ${S.checks.f14?"disabled":""}><i></i><span>${S.checks.f14?"✓ Мой фокус — на доходе":"Мой фокус — на доходе, а не на долгах"}</span></button>
  <h3 style="margin-top:16px">Что я сегодня сделала, чтобы заработать?</h3>${ta("f14","Одно конкретное действие…")}`},
 after(){holdBtn("say14",3000,()=>{S.checks.f14=1;save();burst(60,["₸","✦"]);rer()})},
 ok:()=>!S.checks.f14?"Удерживайте кнопку — переключите фокус":(S.texts.f14||"").trim().length<5?"Напишите, что сделали сегодня для дохода":true},

{n:15,t:"Закрываем сценарий «беру в долг»",law:["Детская позиция",`<p><b>Брать в долг — это детская позиция.</b> Деньги в долг = отсутствие управления. Когда вы берёте, вы берёте чужую энергию и создаёте обязательство.</p>`],s:"С этого момента начинается настоящая свобода",
 idea:`<p><b>Больше не берём в долг</b> — ни у людей, ни кредиты, ни рассрочки. Полностью закрываем этот сценарий.</p><p>Каждый новый долг откатывает вас назад: снова напряжение, снова зависимость, снова хаос. Вы только начали выходить — не нужно возвращаться.</p>
 <div class="scale"><div style="background:rgba(255,122,138,.10);border:1px solid rgba(255,122,138,.4)"><b>Раньше</b><p class="small" style="margin:6px 0 0">«не хватает → возьму»</p></div><div style="background:rgba(95,224,168,.10);border:1px solid rgba(95,224,168,.4)"><b>Теперь</b><p class="small" style="margin:6px 0 0">«не хватает → найду способ заработать», «перераспределю», «переживу»</p></div></div>
 <p class="small">Исключение — только форс-мажор: здоровье, критическая ситуация. Но и тогда — осознанно, с планом возврата.</p>`,
 tool(){return `<h3>Моё решение</h3><p class="mut">Удерживайте кнопку 3 секунды</p><button class="btn w hold" id="say15" ${S.checks.d15?"disabled":""}><i></i><span>${S.checks.d15?"✓ С сегодняшнего дня я больше не беру в долг":"С сегодняшнего дня я больше не беру в долг"}</span></button>
  <h3 style="margin-top:16px">Последний раз, когда я взяла в долг</h3><p class="mut small">Что я могла сделать по-другому?</p>${ta("last15","Вспомните ситуацию…")}
  <h3>3 способа решить нехватку денег — через доход, а не долг</h3>${[0,1,2].map(i=>`<input style="margin:5px 0" placeholder="${i+1}. например: ${["продать ненужное","взять подработку","предложить свою услугу"][i]}" value="${esc(S.texts["w15_"+i]||"")}" oninput="S.texts['w15_${i}']=this.value;save()">`).join("")}`},
 after(){holdBtn("say15",3000,()=>{S.checks.d15=1;save();burst(80,["✦"]);rer()})},
 ok:()=>!S.checks.d15?"Примите решение — удерживайте кнопку":(S.texts.last15||"").trim().length<10?"Вспомните последний случай долга":[0,1,2].some(i=>!(S.texts["w15_"+i]||"").trim())?"Напишите 3 способа через доход":true},

{n:16,t:"Ежедневные действия = рост дохода",more:`<p class="small"><b>Если вы в найме</b> — тоже действуете: усиливаете результат, просите повышение, ищете дополнительный доход. Не стоите на месте. Берёте одну идею — делаете шаг — потом ещё шаг. Не ждите «идеального времени»: всё складывается в процессе.</p>`,law:["Всё на себе",`<p>Когда человек всё тащит на себе и не просит помощи, он выгорает, а доход упирается в потолок. Это тоже детская позиция, и она сильно влияет на деньги.</p>`],s:"Каждый день — шаг",
 idea:`<p>Не через день, не «когда будет настроение» — ежедневно. Новые идеи приходят только в процессе.</p><div class="idea">Маленькие действия — тоже действия: написать 1 человеку, выложить 1 пост, сделать 1 звонок.</div><p class="quote">«Что я сегодня сделала, чтобы увеличить доход?»</p>`,
 tool(){const ideas=S.ideas.length?S.fav.map(i=>S.ideas[i]).filter(Boolean).concat(S.ideas.filter((_,i)=>!S.fav.includes(i))):["— сначала добавьте идеи в уроке 12 —"];
  const EX=["Написала 3 знакомым о своей услуге","Выложила объявление в чат района","Сделала 1 звонок","Выложила пост или сторис о себе","Предложила услугу соседке","Отправила резюме / откликнулась на подработку"];
  return `<p class="small">Каждый день вы делаете <b>хотя бы одно действие</b> в сторону денег и отмечаете его здесь. Сегодня заполните <b>День 1</b>, остальные — по одному в день.</p>
  <h3>Примеры действий — нажмите, и пример вставится в ближайший день</h3><div class="chips">${EX.map(e=>`<span class="chip" onclick="A.ex16('${e}')">${e}</span>`).join("")}</div>`+
  [1,2,3,4,5,6,7].map(d=>{const x=S.days16[d]||{};return `<div class="card" style="padding:12px;${x.done?"border-color:var(--gold)":""}"><div class="row"><b style="color:var(--gold2)">День ${d}</b><span class="chip ${x.done?"on":""}" style="flex:none" onclick="A.d16(${d},'done',!${!!x.done})">${x.done?"✓ сделала":"отметить: сделала"}</span></div>
  <label>Над какой идеей работаю</label><select onchange="A.d16(${d},'idea',this.value)" style="padding:8px">${ideas.map(i=>`<option ${x.idea==i?"selected":""}>${esc(i)}</option>`).join("")}</select>
  <label>Что я сделала сегодня (конкретно)</label><input id="act16_${d}" placeholder="Например: написала 3 знакомым" value="${esc(x.act||"")}" onchange="A.d16(${d},'act',this.value)" style="padding:8px"></div>`}).join("")+`<p class="mut small">Курс сохранит всё — возвращайтесь каждый день.</p>`},
 ok:()=>Object.values(S.days16).some(x=>x.done&&x.act)||"Сделайте первое действие сегодня и отметьте его"},

{n:17,t:"Не оценивай — делай",more:`<p class="small"><b>Про жалость к себе:</b> «мне тяжело», «я устала», «у меня не получится» — это позиция жертвы. В этом состоянии нет действий — нет дохода. Не идеал, а движение: именно через это вы быстрее закрываете долги и увеличиваете доход.</p>`,s:"Как не блокировать жизнь клиенту",
 idea:`<p>«А сколько это стоит?», «А вдруг не купят?» — пока вы оцениваете, вы останавливаетесь.</p><div class="idea">Когда вы не предлагаете — клиент не получает свой результат. Начинайте с малого: маленькие чеки, простые действия, первые клиенты.</div><p class="quote">«Смотрим в страх в глаза — и делаем. Просто делаем»</p>`,
 tool(){const W=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];return `<h3>3 инсайта: как я блокировала себя</h3>${[0,1,2].map(i=>`<input style="margin:5px 0" placeholder="${["Оценивала…","Сомневалась…","Жалела себя…"][i]}" value="${esc(S.ins17[i])}" onchange="A.arr('ins17',${i},this.value)">`).join("")}
  <h3>Мой график проявления</h3><div class="chips">${W.map(w=>`<span class="chip ${S.plan.days.includes(w)?"on":""}" onclick="A.planDay('${w}')">${w}</span>`).join("")}</div><label>Время</label><input type="time" value="${S.plan.time}" onchange="S.plan.time=this.value;save()">
  ${chk("first17","Я проявилась сегодня — написала о себе и своей услуге")}`},
 ok:()=>S.ins17.filter(x=>x.trim()).length<3?"Напишите 3 инсайта":!S.plan.days.length?"Выберите дни":!S.checks.first17?"Сделайте первое проявление":true},

{n:18,t:"Состояние и движение",more:`<p class="quote">«Я привлекаю большие деньги экологичным образом»</p><p class="small">Ритуал делаем каждый день — до тех пор, пока не выйдете в плюс и не появится энергия.</p>`,s:"Лёгкость, азарт, энергия",
 idea:`<p>Деньги приходят на лёгкость и азарт — не на тяжесть и контроль. Будим внутреннего ребёнка: он хочет, играет, действует, не боится.</p><div class="idea">Зарабатываем честно, без обмана, с чистым намерением.</div><h3>Деньги — везде вокруг вас</h3><p>Возьмите стикеры и напишите на каждом: «Деньги в моём доме», «Я зарабатываю легко», «Деньги приходят ко мне каждый день». Купите сувенирные деньги и разложите их по дому: на холодильник, у раковины, на стол — пачками, там, где вам удобно. Пусть ваши глаза привыкнут, что деньги есть везде. Тогда взгляд раскрывается, и вы начинаете видеть деньги и возможности повсюду.</p>`,
 tool(){return `<div class="ringbtn" onclick="A.home()"><div>Деньги домой!<div style="font-size:30px" id="homen">${S.home18||""}</div></div></div><p class="mut center">Подойдите к окну и нажимайте — проговаривая вслух с эмоцией</p>
  <h3>Ритуал сегодня</h3>${chk("r18a","Написала на пятке: $, ₸, €")}${chk("r18b","Пробежалась по дому: «Деньги бегают за мной по пятам»")}${chk("r18c","Сказала у окна: «Деньги приходят в мой дом!»")}${chk("r18d","Написала стикеры и наклеила их по дому")}${chk("r18e","Разложила сувенирные деньги: холодильник, раковина, стол…")}
  <h3>В каком состоянии я чаще зарабатываю?</h3><div class="seg"><button class="${S.state18=="h"?"on":""}" onclick="A.set('state18','h')">Тяжело / страх</button><button class="${S.state18=="l"?"on":""}" onclick="A.set('state18','l')">Лёгкость / игра</button></div>`},
 ok:()=>!(S.checks.r18a&&S.checks.r18b&&S.checks.r18c&&S.checks.r18d)?"Сделайте ритуал и наклейте стикеры":!S.state18?"Ответьте про состояние":true},

{n:19,t:"Поощрение = закрепление",s:"Закрыли долг → сразу поощрили себя",
 idea:`<p>Мозг запоминает связку «закрываю долг = мне хорошо» и хочет повторять.</p><div class="idea">Закрыли 200 000 → подарок на 10–15 000. Закрыли 50 000 → на 2–3 000. Сразу, не откладывая.</div><p class="quote">«Я закрыла! Молодец!»</p>`,
 tool(){return `<h3>Мой список поощрений (от 500 до 5 000 ₸)</h3><p class="mut small">Нажмите пример — он добавится в список. Или впишите своё.</p><div class="chips">${[["Кофе в любимом месте",1500],["Цветы себе",3000],["Маникюр",5000],["Новая книга",3000],["Кино",2500],["Вкусный десерт",1000],["Ароматная свеча",2500],["Прогулка в красивом месте и чай",1000],["Новая помада",4000],["Час для себя без дел",500]].map(([n,p])=>`<span class="chip" onclick="A.rwQuick('${n}',${p})">＋ ${n} · ${fmt(p)}</span>`).join("")}</div><div class="row"><input id="rwn" placeholder="Что-то приятное"><input id="rwp" inputmode="numeric" placeholder="₸" style="max-width:110px"><button class="btn sm" style="flex:none" onclick="A.addRw()">＋</button></div><div class="prog" style="margin-top:10px"><i style="width:${Math.min(1,S.rewards.length/10)*100}%"></i></div><p class="mut">${S.rewards.length} из 10</p>`+
  S.rewards.slice().sort((a,b)=>a.p-b.p).map(r=>`<div class="item"><div class="grow"><b>${esc(r.n)}</b></div><b style="color:var(--gold2)">${fmt(r.p)}</b><button class="x" onclick="A.delRw('${r.id}')">✕</button></div>`).join("")+
  `<div class="card"><h3>Калькулятор подарка</h3><input inputmode="numeric" placeholder="Сколько закрыла" oninput="document.getElementById('rwc').innerHTML=num(this.value)?'Подарок себе: <b>'+fmt(num(this.value)*0.05)+'</b>':''"><p id="rwc" class="center" style="margin-top:8px"></p></div><h3>Мой якорь «я закрыла — я молодец»</h3><input placeholder="Символ или ритуал" value="${esc(S.anchor)}" onchange="A.set('anchor',this.value,1)">`},
 ok:()=>S.rewards.length<10?"Нужно 10 поощрений":!S.anchor.trim()?"Придумайте свой якорь":true},

{n:20,t:"50% на закрытие долгов",law:["Изобилие и нехватка",`<p>Деньги, которые отдают из страха и нехватки, закрепляют нехватку. Состояние, в котором вы отдаёте, влияет на то, как деньги к вам возвращаются.</p>`],s:"Отдаём деньги как для себя",
 idea:`<p>Минимум 50% дохода от новых действий — сразу на долги. Не думаем, не откладываем, не тратим.</p><div class="idea">«Сначала потрачу, потом отдам» — не работает. Сначала распределение, потом всё остальное. Старые и новые деньги не смешиваем.</div>`,
 tool(){const h=S.half,to=num(h.inc)*h.pct/100,first=priority().find(d=>!d.closed);
  return `<label>Доход от новых действий</label><input inputmode="numeric" value="${num(h.inc)||""}" oninput="A.half('inc',this.value)"><label>На долги: <b id="pct" style="color:var(--gold)">${h.pct}%</b></label><input type="range" min="50" max="100" step="5" value="${h.pct}" oninput="A.half('pct',this.value)" style="padding:0">
  <div class="card glow center" id="halfR">${halfRes(to,first)}</div>
  <h3>Когда отдаёте — скажите себе</h3><button class="btn w hold" id="say20" ${h.said?"disabled":""}><i></i><span>${h.said?"✓ Я отдаю деньги как для себя":"Удерживайте: «Я отдаю деньги как для себя»"}</span></button>`},
 after(){holdBtn("say20",2500,()=>{S.half.said=true;save();burst(50,["₸","✦"]);rer()})},
 ok:()=>!num(S.half.inc)?"Впишите доход от новых действий":!S.half.said?"Скажите фразу":true},

{n:21,t:"Законы системы: как всё устроено",s:"Глубина даёт стабильность",
 idea:`<p>Всё, что вы сделали до этого, — это действия и система. Но есть ещё <b>глубина</b>, которая напрямую влияет на результат. Это законы квантового поля:</p>
 <div class="idea"><b>Закон иерархии</b><br><b>Закон принадлежности и исключения</b><br><b>Закон баланса</b><br><br>Именно они формируют <b>деньги, здоровье и отношения</b>.</div>
 <p>Если есть нарушения, вы можете делать действия и зарабатывать — но деньги будут не держаться, уходить, тормозиться. Потому что причина глубже.</p>
 <div class="scale"><div style="background:rgba(255,122,138,.10);border:1px solid rgba(255,122,138,.4)"><b>Без глубины</b><p class="small" style="margin:6px 0 0">можно зарабатывать, но не удерживать</p></div><div style="background:rgba(95,224,168,.10);border:1px solid rgba(95,224,168,.4)"><b>С глубиной</b><p class="small" style="margin:6px 0 0">деньги закрепляются, поток растёт</p></div></div>
 <p class="quote" style="font-size:16px">Вы уже сделали базу ✔ Дальше идёт глубина ✔ Именно она даёт масштаб</p>`,
 tool(){const SF=["Деньги","Отношения","Здоровье","Дело и работа","Семья и род","Внутреннее состояние"];
  return `<h3>Где мне сейчас труднее всего?</h3><p class="mut small">Отметьте сферы, где вы чувствуете, что «что-то не так».</p><div class="chips">${SF.map(f=>`<span class="chip ${S.spheres[f]?"on":""}" onclick="A.sph('${f}')">${S.spheres[f]?"✓ ":""}${f}</span>`).join("")}</div>
  <div class="card glow"><span class="tag">Это только часть</span><h3>🚀 Квантовый Взлёт</h3><p>Сейчас вы увидели только маленькую часть того, как работают законы системы. В Квантовом Взлёте мы проходим их глубоко, шаг за шагом, и возвращаем вас на своё место во всех сферах сразу.</p>
  <p class="small">9 модулей за 3 месяца: Мир систем · Законы поля · Мама · Папа · Род · Любовь к себе · Я — Творец своей жизни · Отношения · Выход во взрослую позицию.</p>
  <p class="quote" style="font-size:16px">Не уходите — дальше вас ждёт ещё интересное.</p></div>
  <details class="card" style="border-color:var(--gold)"><summary style="cursor:pointer;color:var(--gold2);font-weight:600">🌱 Хочу почувствовать это уже сейчас</summary><p class="small" style="margin:10px 0 6px">Можно примерить Квантовый Взлёт, не дожидаясь конца курса. <b>Старт — 50 000 ₸</b>: модули «Мир систем» и «Законы квантового поля» и первый урок модуля «Мама» — «Принятие мамы в сердце». Мама — это 50% вас и зеркало мира: от неё зависят деньги и доверие к жизни.</p><p class="small" style="margin:0 0 10px">Откроется сразу, уроки идут по вашему графику. Решите продолжить — доплатите только остаток (${fmt(kvP().dop)}).</p>${payBox("kvs","Примерить — 50 000 ₸",true)}</details>`},
 ok:()=>!Object.values(S.spheres).some(Boolean)?"Отметьте хотя бы одну сферу":true},

{n:22,t:"Квантовое поле и деньги",more:`<h3>Масштаб в квантовом поле</h3><div class="scale"><div style="background:rgba(255,255,255,.04);border:1px solid rgba(154,163,208,.3)"><p class="small" style="margin:0">Если внутри ты маленькая — деньги ведут себя как «большие».</p></div><div style="background:rgba(232,197,106,.10);border:1px solid var(--gold)"><p class="small" style="margin:0">Если внутри ты большая — деньги становятся «простыми».</p></div></div><p class="small">Деньги приходят не за счёт количества часов — у всех одинаковые 24 часа. Деньги приходят от твоего навыка, мышления, умения держать фокус, точки сборки и выхода в плюс-состояние.</p>
 <h3>Почему возникают долги</h3><div class="idea">1. Когда мы осуждаем или обвиняем человека с долгами — мы «забираем» это в своё поле.<br>2. В поле все элементы важны. Каждому дано своё место.<br>3. Исключая другого, мы создаём дыру в собственном поле.<br>4. По закону баланса на место осуждаемого становимся мы сами.</div>
`,s:"Чувство долга притягивает долги",
 idea:`<p class="quote">«Я не возвышаю деньги»</p><p>Деньги — просто цифры. В поле нет «больших» и «маленьких» денег — это мы добавляем им значимость.</p><div class="idea">Когда мы осуждаем человека с долгами — мы будто забираем это себе. Исключая другого, мы сами встаём на его место.</div><p class="quote">Не деньги ограничивают тебя — мышление ограничивает поток</p>`,
 med:"Медитация на возврат долгов в поле",
 tool(){const P=["Мне очень жаль. Я тебя вижу.","Мне жаль, что я тебя осудила.","Это твоё — и ты с этим справишься.","У тебя отдельная судьба, у меня отдельная судьба.","Я хочу чувствовать свои чувства и проживать свою жизнь.","Я отпускаю тебя. Ты есть в моём поле. Я тебя больше не исключаю."];
  return audioUI(22)+`<h3>Фразы — открывайте по одной и проговаривайте</h3>`+P.map((p,i)=>`<div class="phrase ${S.phr22.includes(i)?"on":"hid"}" onclick="A.phr(${i})">${p}</div>`).join("")+`<h3>Что я почувствовала?</h3>${ta("refl22","После практики…")}`},
 ok:()=>S.phr22.length<6?"Откройте все 6 фраз":(S.texts.refl22||"").length<10?"Напишите, что почувствовали":true},

{n:23,t:"Квантовый Взлёт",s:"Все сферы в балансе — следующий уровень",more:`<h3>Что такое Квантовый Взлёт</h3><p>Это 3-месячный курс, который возвращает вас на своё место в системе: в семье, роду, паре, работе и деньгах. Через законы систем, язык квантового поля и работу с родом. Когда вы на своём месте — приходят деньги, отношения, здоровье и опора.</p><h3>Что вы получите</h3><div class="idea">✦ Примете маму и папу и откроете поток рода<br>✦ Выйдете из детских позиций во взрослую<br>✦ Восстановите баланс «давать — брать» в деньгах, паре и работе<br>✦ Освободитесь от повторения судьбы рода<br>✦ Выстроите иерархию в отношениях, полюбите себя и станете творцом своей жизни</div><h3>Что вас ждёт: 9 модулей</h3><p class="small">1. Мир систем. Путь героя<br>2. Законы квантового поля: принадлежность, иерархия, баланс<br>3. Мама<br>4. Папа — опора, сила, структура, большие деньги<br>5. Род<br>6. Любовь к себе<br>7. Я — Творец своей жизни<br>8. Отношения. Иерархия<br>9. Выход из детской позиции во взрослую</p><p class="small">В конце курса — большая денежная медитация.</p><h3>Вместе с курсом — приложение</h3><p class="small">✦ Ресурс дня: каждое утро карта и маленькое задание, вечером — «бонусы дня»<br>✦ Игры после модулей: увидеть, где в вашей жизни нарушен порядок<br>✦ Еженедельная оцифровка жизни: график «было → стало» по 10 сферам</p><h3>Как проходит</h3><p class="small">День 1 — смотрите урок и делаете задание, день 2 — отдых. Пока не сделано задание, к следующему уроку не переходите. Каждое воскресенье — «оцифровка жизни»: вы оцениваете 10 сфер от 1 до 10 и видите, как меняется жизнь. 50% даёт Венера, 50% делаете вы — вместе это 100% результат.</p><div class="card center" style="border-color:var(--gold)"><div class="mut">Общий старт</div><div class="big" style="font-size:28px">17 декабря</div><div class="mut">«Войди в 2027 год на своём месте»</div></div><p class="small center" style="margin-top:10px">Можно сначала <b>примерить</b>: Старт — 50 000 ₸ (первые модули), или взять <b>весь курс</b> — ${kvP().e?"150 000 ₸ до 17 декабря, потом 180 000 ₸":"180 000 ₸"}. Свой шаг вы выберете в последнем уроке курса.</p>`,
 idea:`<p>Бывает так: по деньгам прилетают штрафы, долги, потери — а проблема совсем в другом месте.</p>
 <div class="idea">Иногда у человека не в порядке отношения, и нарушен <b>закон иерархии</b>.<br>Иногда он не знает <b>баланса «давать — брать»</b>: много отдаёт и не умеет брать.<br>Иногда в его системе <b>кого-то исключили</b> — и это тоже отзывается в деньгах.</div>
 <p>Поэтому важно прокачивать <b>все сферы</b>. Когда в одной сфере перекос, остальные начинают его «оплачивать». Когда все сферы в равновесии — деньгам есть на что опереться.</p>
 <p>Именно это мы делаем в <b>Квантовом Взлёте</b>: выравниваем все сферы сразу, и тогда приходит баланс.</p>`,
 tool(){const SF=["Деньги","Отношения","Здоровье","Дело и работа","Семья и род","Внутреннее состояние"];const v=SF.map(f=>+(S.spheres["r_"+f]||0));const done=v.every(x=>x>0);const mn=Math.min(...v.filter(x=>x>0));
  return `<h3>Оцените свои сферы от 1 до 10</h3>`+SF.map((f,i)=>`<label>${f}: <b style="color:var(--gold)" id="sv${i}">${v[i]||"—"}</b></label><input type="range" min="1" max="10" value="${v[i]||5}" oninput="A.rate('${f}',this.value,${i})" style="padding:0">`).join("")+
  (done?`<div class="card glow center"><div class="mut">Ваша самая слабая сфера</div><div class="big" style="font-size:26px">${SF.filter((f,i)=>v[i]==mn).join(", ")}</div><p class="small">Если деньги «не держатся», загляните сюда: часто корень именно в самой слабой сфере.</p></div>`:`<p class="mut small">Сдвиньте каждый ползунок.</p>`)},
 ok:()=>["Деньги","Отношения","Здоровье","Дело и работа","Семья и род","Внутреннее состояние"].every(f=>S.spheres["r_"+f])||"Оцените все 6 сфер"},

{n:30,gift:1,t:"Разговор с деньгами",s:"🎁 Подарок от Венеры",
 idea:`<p>Практика, в которой вы по-настоящему увидите, в каких вы отношениях с деньгами: близко они к вам или далеко, тянутся к вам или уходят. Это можно увидеть уже сегодня.</p><p class="mut">Найдите 15 минут тишины, наденьте наушники, возьмите тетрадь.</p>`,
 med:"Медитация «Разговор с деньгами»",
 tool(){return audioUI(30)+`<h3>После медитации</h3>${[["Как выглядели мои деньги в начале и в конце?"],["Что деньги мне сказали?"],["Одно действие для денег сегодня"]].map((q,i)=>`<label>${q}</label><textarea onchange="A.arr('med',${i},this.value)" style="min-height:60px">${esc(S.med[i])}</textarea>`).join("")}`},
 ok:()=>S.med.filter(x=>x.trim()).length<3||"Ответьте на 3 вопроса"},

{n:24,bridge:1,t:"Что дальше",s:"Урок-мост: ваша база готова",med:"Финальная медитация",
 idea:`<p>Посмотрите, что вы уже сделали: честно увидели свои деньги, выписали долги, навели учёт, нашли идеи дохода и начали действовать. <b>Это ваша база.</b> И она уже меняет жизнь: деньги перестают утекать незаметно.</p>
 <div class="idea"><b>Без ежедневных действий деньги не работают.</b> Ни одна практика не заменит шаг: позвонить, написать, предложить, отложить. Каждый день — хотя бы одно действие в сторону денег.</div>
 <p>Но бывает и так: вы всё делаете правильно, а деньги снова уходят, долги возвращаются, доход упирается в один и тот же потолок. Значит, причина не в учёте. Она глубже — в том, на каком месте вы стоите в своей системе. Вы видели это в игре «Своё место».</p>`,
 tool(){const wa=t=>`https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(t)}`,P=kvP();
  return `<h3>Моё ежедневное действие в сторону денег</h3><input value="${esc(S.texts.daily24||"")}" placeholder="Например: каждый день 3 предложения своей услуги" oninput="S.texts.daily24=this.value;save()">
  <h3 style="margin-top:18px">Финальная медитация</h3><p class="mut small">Перед выбором — 10 минут тишины. Наденьте наушники. Почувствуйте свою базу и спросите себя: куда я иду дальше?</p>${audioUI(24)}
  <h3 style="margin-top:18px">Если хотите идти глубже</h3>
  ${kvCount()}
  <div class="card" style="border-color:var(--gold)"><span class="tag">примерить</span><h3>🌱 Старт Квантового Взлёта — 50 000 ₸</h3><p class="small">Хотите сначала посмотреть, как это работает? Старт — это первые модули курса: <b>Мир систем</b> и <b>Законы квантового поля</b>, плюс первый урок модуля «Мама» — «Принятие мамы в сердце». Вы увидите, как законы проявляются в вашей жизни. Решите продолжить — доплата ${fmt(P.dop)} (в сумме ${fmt(P.sum)}).${P.e?" Кто берёт Старт до 17 декабря — доплата остаётся 130 000 ₸ и после.":""}</p>${payBox("kvs","Хочу примерить — 50 000 ₸")}</div>
  <div class="card" style="border-color:var(--gold)"><span class="tag">весь курс · выгоднее на 30 000 ₸</span><h3>🚀 Квантовый Взлёт целиком — ${fmt(P.full)}</h3><p class="small">Все 9 модулей за 3 месяца: встать на своё место во всех сферах — в деньгах, отношениях, деле и здоровье.${P.e?" Цена 150 000 ₸ — до 17 декабря, потом 180 000 ₸.":""}</p><p class="small"><b>Бонусы только при полной оплате:</b><br>✦ диагностика Венеры — интерактив, где вы увидите реальность своей жизни<br>✦ первым 10 участникам — живая диагностика с Венерой</p>${payBox("kv","Хочу весь курс — "+fmt(P.full))}</div>
  <div class="card" style="border-color:var(--violet)"><span class="tag">90 дней · лично с Венерой</span><h3>💎 Алхимия изобилия — 690 000 ₸</h3><p class="small">Глубокое личное наставничество: вытащить все свои блоки в деньгах и жизни, с сопровождением Венеры. Мест мало.</p><a class="btn ghost w" href="${CONFIG.PAY_AI||wa("Венера, я прошла «Денежный Взлёт» и хочу в наставничество «Алхимия изобилия». Мой код: "+S.code)}" target="_blank" rel="noopener">Хочу в наставничество</a></div>
  <div class="card center"><p class="small" style="margin:0 0 8px">Пока решаете — будьте рядом. В <b>Пространстве Трансформации</b> Венера проводит разборы вживую. Бесплатно.</p><a class="btn sm ghost w" href="${CONFIG.SPACE_TG}" target="_blank" rel="noopener">✨ Пространство Трансформации</a></div>`},
 ok:()=>(S.texts.daily24||"").trim().length<5?"Напишите своё ежедневное действие":true}
];
L.forEach(l=>{if(l.ok){const o=l.ok;l.ok=()=>{const r=o();return typeof r==="string"?r:(r?true:"Выполните задание урока")}}});

/* ================= МАЛЕНЬКИЕ БЛОКИ ================= */
function faq(l){if(!l.faq)return"";return `<div class="card"><h3 style="margin-top:0">Частые вопросы</h3>${l.faq.map(([q,a])=>`<details style="margin:8px 0"><summary style="cursor:pointer;color:var(--gold2);font-weight:600">${q}</summary><p class="small" style="margin:6px 0 0">${a}</p></details>`).join("")}</div>`}
function daysTo(iso){const t=new Date(iso+"T23:59:59"),n=new Date();return Math.ceil((t-n)/864e5)-1}
function summaryText(){const T0=S.debts.reduce((a,d)=>a+num(d.sum),0),dl=openDebts().reduce((a,d)=>a+num(d.daily),0),L=[];
 L.push("ДЕНЕЖНЫЙ ВЗЛЁТ — МОЙ ИТОГ","Имя: "+(S.name||"")+" · "+new Date().toLocaleDateString("ru-RU"),"");
 if(S.debts.length){L.push("МОИ ДОЛГИ — всего "+fmt(T0));S.creds.forEach(c=>{const ps=S.debts.filter(d=>d.credId==c.id);if(!ps.length)return;L.push("• "+c.name+": "+fmt(ps.reduce((a,d)=>a+num(d.sum),0)));ps.forEach(d=>L.push("   – "+d.type+(d.what?" ("+d.what+")":"")+": "+fmt(d.sum)+(d.closed?" — ЗАКРЫТ ✓":"")))});L.push("")}
 if(dl)L.push("Откладываю каждый день: "+fmt(dl)+(totalDebt()?" → свобода от долгов: "+dateIn(totalDebt()/dl):""),"");
 if(avgInc())L.push("Мой реальный доход: "+fmt(avgInc())+" · расходы: "+fmt(expTotal(true)),"");
 if(S.quick.length)L.push("Могу делать уже сейчас: "+S.quick.join(", "),"");
 if(S.ideas.length){L.push("МОИ ИДЕИ ДОХОДА");S.ideas.forEach((t,i)=>L.push((S.fav.includes(i)?"⭐ ":"• ")+t));L.push("")}
 if(S.texts.step13)L.push("Мой первый шаг: "+S.texts.step13,"");
 if(S.texts.daily24)L.push("Моё ежедневное действие: "+S.texts.daily24,"");
 if(S.rewards.length){L.push("МОИ ПООЩРЕНИЯ");S.rewards.slice().sort((a,b)=>a.p-b.p).forEach(r=>L.push("• "+r.n+" — "+fmt(r.p)));L.push("")}
 if(S.anchor)L.push("Мой якорь: "+S.anchor,"");
 L.push("© Венера Татина · Денежный Взлёт");return L.join("\n")}
function printSummary(){const w=window.open("","_blank");if(!w){A.copy(summaryText());return toast("Итог скопирован — вставьте в заметки")}w.document.write(`<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Денежный Взлёт — мой итог</title><style>body{font:15px/1.55 Georgia,serif;color:#1b1430;max-width:640px;margin:24px auto;padding:0 16px;white-space:pre-wrap}h1{font-size:22px;color:#8a6420}</style></head><body>${esc(summaryText())}<script>setTimeout(()=>print(),400)<\/script></body></html>`);w.document.close()}
function credCard(c){const ps=S.debts.filter(d=>d.credId==c.id),t=ps.reduce((a,d)=>a+num(d.sum),0),ic={bank:"🏦",org:"🏢",person:"👤"}[c.kind]||"🏦";
 const types=c.kind=="person"?["Долг родственнику","Долг знакомому","Другое"]:TYPES;
 return `<div class="card" style="border-color:rgba(232,197,106,.4)"><div class="row"><h3 style="margin:0">${ic} ${esc(c.name)}</h3><b style="flex:none;color:var(--gold2)">${fmt(t)}</b><button class="x" onclick="A.delCred('${c.id}')">✕</button></div>
 ${ps.map(d=>`<div class="item"><div class="grow"><span class="tag">${esc(d.type)}</span>${d.what?`<b style="display:inline">${esc(d.what)}</b> `:""}${d.due?`<span class="mut small">до ${new Date(d.due).toLocaleDateString("ru-RU")}</span>`:""}<div class="row" style="margin-top:6px"><input inputmode="numeric" value="${num(d.sum)||""}" placeholder="сумма" onchange="A.edit('${d.id}','sum',this.value);rer()" style="padding:8px"><input inputmode="numeric" placeholder="в месяц" value="${num(d.monthly)||""}" onchange="A.edit('${d.id}','monthly',this.value)" style="padding:8px"></div></div><button class="x" onclick="A.delDebt('${d.id}')">✕</button></div>`).join("")}
 <label>${ps.length?"Ещё позиция":"Что это"}</label><select id="pt_${c.id}" onchange="const w=document.getElementById('pw_${c.id}');w.placeholder=WHAT[this.value]||'что именно'"><option value="">— выберите —</option>${types.map(t=>`<option>${t}</option>`).join("")}</select>
 <label>Что именно</label><input id="pw_${c.id}" placeholder="${c.kind=="person"?"на что брала":"сначала выберите, что это"}">
 <div class="row"><div><label>Сумма долга</label><input id="ps_${c.id}" inputmode="numeric" placeholder="0"></div><div><label>Платёж в месяц</label><input id="pm_${c.id}" inputmode="numeric" placeholder="если есть"></div></div>
 <label>Срок (когда нужно отдать)</label><input id="pd_${c.id}" type="date">
 <button class="btn sm w" style="margin-top:10px" onclick="A.addPos('${c.id}')">＋ Добавить позицию в «${esc(c.name)}»</button></div>`}
function law(l){if(!l.law)return"";return `<details open class="card" style="border-color:rgba(123,92,255,.55);background:linear-gradient(135deg,rgba(123,92,255,.18),rgba(18,24,58,.62))"><summary style="cursor:pointer;color:#d8d0ff;font-weight:600">🔑 Закон системы: ${l.law[0]}</summary><div style="margin-top:10px">${l.law[1]}<p class="small" style="margin:8px 0 0">Почему так происходит и как это изменить — мы глубоко проходим в Квантовом Взлёте.</p></div></details>`}
function aiPrompt(){const a=S.ai13,f=(k,d)=>(a[k]||"").trim()||d;return `Ты мой помощник по поиску дохода. Помоги мне найти реальные источники денег, которые подходят именно мне.

Обо мне:
— Город: ${f("city","[где живу]")}
— Что я умею делать: ${f("skills","[навыки, даже простые]")}
— Где работала раньше и кем: ${f("job","[опыт]")}
— С чем ко мне чаще всего обращаются люди: ${f("ask","[о чём просят помочь]")}
— Что мне нравится делать: ${f("like","[увлечения]")}
— Сколько времени в день могу уделять: ${f("hours","[часов]")}
— Сколько денег могу вложить на старте: ${f("budget","0")}
— Сколько хочу дополнительно зарабатывать в месяц: ${f("want","[сумма в тенге]")}

Сделай так:
1. Предложи 10 идей дохода именно под меня: что делать, кому это нужно, сколько примерно можно брать за работу.
2. Выбери 3 лучшие для старта: быстрые, без больших вложений и с опорой на то, что я уже умею.
3. По каждой из трёх распиши первые шаги на 7 дней: что сделать в 1-й день, во 2-й и так далее.
4. Напиши, где найти первых клиентов: какие сайты, чаты и знакомые подойдут, и готовый текст первого сообщения.
5. Пиши просто, без сложных слов. В конце задай мне 3 вопроса, чтобы уточнить лучшую идею.`}
function chk(k,t){return `<div class="check ${S.checks[k]?"on":""}" onclick="A.chk('${k}')"><div class="box">${S.checks[k]?"✓":""}</div><div>${t}</div></div>`}
function ta(k,ph){return `<textarea placeholder="${ph}" oninput="S.texts['${k}']=this.value;save()">${esc(S.texts[k]||"")}</textarea>`}
