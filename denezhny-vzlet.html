 (S.done[1]&&!S.noDebts?`<button class="btn sm ghost w" style="margin:6px 0" onclick="go(1)">＋ Вспомнила ещё долг — добавить</button>`:"")+
 L.filter(l=>l.gift).map(l=>`<div class="node ${S.gift||S.admin?"done":"lock"}" onclick="go(${l.n})"><div class="planet">🎁</div><div class="t"><b>Подарок: ${esc(l.t)}</b><span>${S.gift||S.admin?"Откройте, когда будет 15 минут тишины":"Откройте кодом подарка от Венеры"}</span></div></div><div class="trail"></div>`).join("")+
 L.filter(l=>!l.gift).map((l,i)=>{const st=l.soon?"soon":S.done[l.n]?"done":unlocked(l)?"cur":"lock";return (i?`<div class="trail"></div>`:"")+`<div class="node ${st} ${i%2?"r":""}" onclick="go(${l.n})"><div class="planet">${l.soon?"скоро":st=="lock"?"🔒":st=="done"?"✓":l.bridge?"✦":l.n}</div><div class="t"><b>${l.bridge?"✦ ":"Урок "+l.n+". "}${esc(l.soon?"Готовится":l.t)}</b><span>${esc(l.s)}</span></div></div>`}).join("")+
 `</div>${real().every(l=>S.done[l.n])?`<button class="btn w" onclick="view={s:'final'};render()">✨ Мой итог</button>`:""}`;
 const cur=document.querySelector(".node.cur");if(cur&&!render._scrolled){render._scrolled=1;setTimeout(()=>cur.scrollIntoView({behavior:"smooth",block:"center"}),300)}
}
function go(n){const l=L.find(x=>x.n==n);if(l.soon)return toast("Этот урок скоро появится");if(l.gift&&!S.gift&&!S.admin){const c=prompt("Введите код подарка от Венеры");if(c&&hash(c)===CONFIG.GIFT_HASH){S.gift=true;save();burst(120,["🎁","✦"]);toast("Подарок открыт!")}else{if(c)toast("Код не подошёл");return}}if(!unlocked(l))return toast("Сначала пройдите предыдущий урок");view={s:"lesson",n};window.scrollTo(0,0);render();track("open",{lesson:n})}
function rer(){const y=scrollY;renderLesson();window.scrollTo(0,y)}
function renderLesson(){const l=L.find(x=>x.n==view.n),r=l.ok(),src=(window.LESSON_AUDIO||{})[l.n];
 $("#app").innerHTML=topbar()+`<button class="btn sm ghost" onclick="view={s:'map'};render()">← Карта</button>
 <div class="center" style="margin-top:10px"><span class="tag">${l.gift?"ПОДАРОК":l.bridge?"ФИНАЛ":"УРОК "+l.n}</span><h2>${l.t}</h2><p class="mut">${l.s}</p></div>
 ${src?`<div class="audio"><div class="ic">🔊</div><div class="grow"><b>Озвучка урока</b><audio controls src="${src}"></audio></div></div>`:""}
 ${S.admin?adminNav(l):""}
 <div class="card">${l.idea}${l.more||""}</div>${faq(l)}${law(l)}<div class="card glow">${l.tool()}</div>
 ${l.n>0&&!l.gift?`<div class="card" style="border-color:rgba(232,197,106,.45)"><b>✍️ Тетрадь</b><p class="small" style="margin:6px 0 8px">Запишите от руки главную мысль этого урока и своё действие. Когда пишешь рукой — мозг запоминает намного лучше.</p>${chk("nb_"+l.n,"Записала в тетрадь")}</div>`:""}
 <div class="card"><h3>Что было трудно в этом уроке?</h3><textarea placeholder="Честно, пару слов — Венера прочитает" oninput="S.hard[${l.n}]=this.value;save()">${esc(S.hard[l.n]||"")}</textarea></div>
 <div style="height:70px"></div><div class="fixedbot"><div><button class="btn w" onclick="finish()" ${r===true?"":"style='opacity:.6'"}>${S.done[l.n]?"✓ Урок пройден — дальше":"Урок выполнен ✓"}</button>${r!==true?`<div class="mut center small" style="margin-top:6px">${S.admin?"👑 ученику нужно: ":""}${r}</div>`:""}</div></div>`;
 l.after&&l.after()}
function again(){if(!confirm("Пройти курс заново? Ваши долги, доходы и идеи сохранятся, задания нужно будет отметить снова."))return;S.runs=(S.runs||1)+1;S.done={};S.checks={};save();track("again",{runs:S.runs});view={s:'lesson',n:0};render()}
function adminReset(){if(confirm("Стереть все тестовые записи и выйти?")){localStorage.removeItem(KEY);location.reload()}}
function finish(){const l=L.find(x=>x.n==view.n),r=l.ok();if(r!==true&&!S.admin)return toast(r);const first=!S.done[l.n];S.done[l.n]=Date.now();save();if(first){burst(110);track("done",{lesson:l.n,hard:S.hard[l.n]||"",debt:totalDebt()})}
 if(l.gift){view={s:'map'};setTimeout(render,first?900:0);return}const nx=L.slice(L.indexOf(l)+1).find(x=>!x.soon&&!x.gift);if(nx){view={s:"lesson",n:nx.n};setTimeout(()=>{window.scrollTo(0,0);render()},first?900:0)}else{view={s:"final"};setTimeout(render,900)}}
function renderEntry(){$("#app").innerHTML=`<div class="center" style="padding-top:20px">${photo()}<p style="color:var(--gold2);font-family:Georgia,serif;font-size:20px;margin:6px 0">Венера Татина</p><p class="mut">Перестаньте незаметно терять деньги.<br>Начните видеть, считать и копить.</p></div>
 <div class="card glow"><label>Ваше имя</label><input id="nm" value="${esc(S.name)}" placeholder="Как к вам обращаться"><label>Личный код доступа</label><input id="cd" placeholder="DV-XXXXXX" autocapitalize="characters"><button class="btn w" style="margin-top:14px" onclick="enter()">✦ Войти в курс</button><p class="mut center small" style="margin-top:10px">Код вы получили после оплаты. Доступ — ${Math.round(CONFIG.ACCESS_HOURS/24)} ${pl(Math.round(CONFIG.ACCESS_HOURS/24),"день","дня","дней")} с первого входа, курс можно пройти до ${CONFIG.MAX_RUNS} раз.</p></div>
 <p class="center"><a style="color:var(--gold)" href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent("Здравствуйте! Хочу пройти курс «Денежный Взлёт»")}">Нет кода? Написать Венере</a></p>`}
function enter(){const n=$("#nm").value.trim(),c=$("#cd").value.trim().toUpperCase();if(!n)return toast("Напишите имя");if(hash(c)===CONFIG.ADMIN_HASH){S.admin=true}else if(!CONFIG.CODE_HASHES.includes(hash(c))){$("#cd").classList.add("shake");return toast("Код не подошёл. Проверьте или напишите Венере")}S.name=n;S.code=c;if(!S.startedAt)S.startedAt=Date.now();save();burst(120,["₸","✦","$","€"]);track("start");view={s:"lesson",n:0};render()}
function renderExpired(){$("#app").innerHTML=`<div class="center" style="padding-top:30px">${photo()}<h2>Время доступа закончилось</h2><p class="mut">Вы прошли ${real().filter(l=>S.done[l.n]).length} из ${real().length} уроков. Всё, что вы записали, сохранено.</p><a class="btn w" href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent("Здравствуйте, Венера! Мой код "+S.code+". Доступ к «Денежному Взлёту» закончился — можно продлить?")}">Написать Венере</a></div>`;track("expired")}
function renderFinal(){const T0=S.debts.reduce((a,d)=>a+num(d.sum),0),cl=S.debts.filter(d=>d.closed).length,dl=openDebts().reduce((a,d)=>a+num(d.daily),0);
 $("#app").innerHTML=topbar()+`<div class="center">${photo()}<h1>${esc(S.name)}, вы прошли!</h1><p class="mut">Это только начало вашего взлёта</p></div>
 <div class="card glow"><table class="table"><tr><td>Все долги, которые вы честно выписали</td><td><b>${fmt(T0)}</b></td></tr><tr><td>Закрыто долгов</td><td><b>${cl} из ${S.debts.length}</b></td></tr><tr><td>Откладываю каждый день</td><td><b>${fmt(dl)}</b></td></tr>${dl&&totalDebt()?`<tr><td>Свобода от долгов</td><td><b>${dateIn(totalDebt()/dl)}</b></td></tr>`:""}<tr><td>Реальный доход</td><td><b>${fmt(avgInc())}</b></td></tr><tr><td>Идей дохода</td><td><b>${S.ideas.length}</b></td></tr><tr><td>Поощрений в списке</td><td><b>${S.rewards.length}</b></td></tr></table></div>
 <div class="card center"><p>Деньги начали слушаться. Ваше ежедневное действие: <b>${esc(S.texts.daily24||"—")}</b></p><button class="btn w" onclick="go(24)">✦ Мои следующие шаги</button></div>
 <div class="card"><h3 style="margin-top:0">Сохраните свой итог</h3><p class="small">Все ваши долги, план, идеи и поощрения — одним документом.</p><button class="btn w" onclick="printSummary()">📄 Сохранить в PDF</button><button class="btn ghost w" style="margin-top:8px" onclick="A.copy(summaryText())">📋 Скопировать текстом</button><p class="mut small" style="margin-top:6px">PDF: в открывшемся окне выберите «Сохранить как PDF» или «Поделиться».</p></div>
 ${(S.runs||1)<CONFIG.MAX_RUNS?`<button class="btn ghost w" style="margin-bottom:10px" onclick="again()">↺ Пройти курс ещё раз (осталось ${CONFIG.MAX_RUNS-(S.runs||1)})</button>`:""}<button class="btn ghost w" onclick="view={s:'map'};render()">← К карте</button>`;burst(150,["₸","✦","$","€"]);track("final")}
setInterval(()=>{const t=$("#tm");if(t)t.textContent=leftTxt();if(S.code&&left()<=0&&view.s!="exp"){view.s="exp";render()}},30000);
render();
</script>
</body>
</html>
