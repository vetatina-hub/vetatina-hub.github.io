<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Новогодняя игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1020;font-family:Montserrat,"Segoe UI",Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 16px 0;pointer-events:none;text-align:center;z-index:2}
.brand{display:inline-block;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:30px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.title{font-weight:900;font-size:26px;margin-top:10px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hint{font-weight:600;font-size:14px;opacity:.85;margin-top:4px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px auto 0;max-width:420px}
.bar{flex:1;height:14px;border-radius:10px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ffd76a,#fff3b8);box-shadow:0 0 14px #ffd76a}
.tm{font-weight:800;font-size:16px;min-width:46px}
#start,#win{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;z-index:5;background:rgba(6,9,20,.72);backdrop-filter:blur(3px)}
#win{display:none}
.card{background:linear-gradient(160deg,#fff,#fff6dc);color:#1b1b2b;border-radius:24px;padding:26px 22px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.card h2{font-weight:900;font-size:26px;line-height:1.15}
.card .gift{font-size:56px;margin:4px 0 6px}
.card .prize{font-weight:800;font-size:22px;color:#d0262e;margin:8px 0}
.card .code{display:inline-block;font-weight:800;letter-spacing:.12em;border:2px dashed #d0262e;border-radius:10px;padding:6px 12px;margin:6px 0 14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:800 18px Montserrat,Arial,sans-serif;color:#fff;background:#25d366;text-decoration:none;box-shadow:0 8px 24px rgba(37,211,102,.45);cursor:pointer}
.btn.y{background:linear-gradient(90deg,#ffb800,#ff7a00);box-shadow:0 8px 24px rgba(255,140,0,.45)}
.small{font-size:12px;opacity:.7;margin-top:10px;color:#333}
.st h1{font-weight:900;font-size:30px;line-height:1.15;margin:14px 0 8px}
.st p{font-weight:600;font-size:16px;opacity:.9;margin-bottom:22px}
.st .big{font-size:70px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><span class="brand" id="brand">Ваш бизнес</span><div class="title" id="ttl"></div><div class="hint" id="hint"></div>
<div class="hud"><div class="bar"><i id="bar"></i></div><div class="tm" id="tm">20</div></div></div>
<div id="start" class="st"><div class="big" id="sbig"></div><h1 id="sh"></h1><p id="sp"></p><button class="btn y" id="go">Играть</button></div>
<div id="win"><div class="card"><div class="gift">🎁</div><h2 id="wh">Поздравляем!</h2><div class="prize" id="wp"></div><div class="code" id="wc"></div><a class="btn" id="wa" target="_blank" rel="noopener">Забрать в WhatsApp</a><div class="small">Покажите код администратору. Подарок действует до 31 декабря.</div></div></div>
<script>
/* ===== Новогодние игры для бизнеса · демо · Венера Татина =====
   Ссылка: index.html?g=smile|glow|chef&brand=Название&prize=Подарок&wa=7XXXXXXXXXX
*/
const Q=new URLSearchParams(location.search);
const G=Q.get("g")||"smile",FILM=Q.has("film");
const CFG={
 smile:{t:"Белоснежная улыбка",h:"Води пальцем — чисти улыбку до блеска",brand:"Ваша клиника",prize:"Профгигиена −30%",big:"🦷",sh:"Сделай улыбку белоснежной за 20 секунд",sp:"Под самым чистым зубом спрятан новогодний подарок",bg1:"#0e2a47",bg2:"#05101f"},
 glow:{t:"Формула сияния",h:"Лови полезные капли, пропускай серые",brand:"Ваш салон",prize:"Чистка лица −30%",big:"✨",sh:"Собери формулу сияния за 20 секунд",sp:"Наполни баночку крема — и подарок твой",bg1:"#3a1a3f",bg2:"#12061a"},
 chef:{t:"Поймай блюдо шефа",h:"Двигай поднос — лови блюда, мимо огня",brand:"Ваш ресторан",prize:"−10% на корпоратив + десерт",big:"🍽️",sh:"Накрой праздничный стол за 20 секунд",sp:"Поймай 8 блюд шефа — и забирай подарок",bg1:"#3b1d0c",bg2:"#120703"}
}[G];
const brand=Q.get("brand")||CFG.brand,prize=Q.get("prize")||CFG.prize,WA=(Q.get("wa")||"77781436982").replace(/\D/g,"");
const code=(G.slice(0,3).toUpperCase())+"-"+(1000+Math.floor((FILM?0.37:Math.random())*9000));
document.getElementById("brand").textContent=brand;document.getElementById("ttl").textContent=CFG.t;document.getElementById("hint").textContent=CFG.h;
document.getElementById("sbig").textContent=CFG.big;document.getElementById("sh").textContent=CFG.sh;document.getElementById("sp").textContent=CFG.sp;
document.getElementById("wp").textContent=prize;document.getElementById("wc").textContent="КОД: "+code;
document.getElementById("wa").href="https://wa.me/"+WA+"?text="+encodeURIComponent("Здравствуйте! Я выиграл(а) в игре «"+CFG.t+"»: "+prize+". Мой код: "+code+". Хочу записаться.");
const cv=document.getElementById("c"),x=cv.getContext("2d");let W,H,DPR;
function size(){DPR=Math.min(3,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}size();addEventListener("resize",size);
let t=0,run=false,done=false,prog=0,TL=20,ptr={x:W/2,y:H*.6,down:false};
const rnd=(()=>{let s=7;return()=>{s=(s*16807)%2147483647;return s/2147483647}})();
const R=FILM?rnd:Math.random;
/* фон: снег и огни */
const SN=[...Array(70)].map(()=>({x:R(),y:R(),r:R()*2+1,v:R()*.03+.02}));
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,CFG.bg1);g.addColorStop(1,CFG.bg2);x.fillStyle=g;x.fillRect(0,0,W,H);
for(let i=0;i<14;i++){const px=(i+.5)*W/14,py=H*.03+Math.sin(i*1.7)*6+150;x.beginPath();x.arc(px,py,4,0,7);const on=Math.sin(t*3+i)>0;x.fillStyle=["#ff5d5d","#ffd76a","#6dff9b","#6ad3ff"][i%4];x.globalAlpha=on?1:.35;x.shadowColor=x.fillStyle;x.shadowBlur=on?14:0;x.fill();x.shadowBlur=0;x.globalAlpha=1}
x.fillStyle="rgba(255,255,255,.8)";SN.forEach(s=>{s.y+=s.v/60;if(s.y>1)s.y=0;x.beginPath();x.arc(s.x*W+Math.sin(t+s.y*9)*8,s.y*H,s.r,0,7);x.fill()})}
/* ===== Игра 1: улыбка ===== */
let teeth=[];
function initSmile(){teeth=[];const cx=W/2,cy=H*.58,tw=Math.min(W*.105,46),th=tw*1.45;for(let r=0;r<2;r++)for(let i=0;i<8;i++){const k=i-3.5,curve=Math.abs(k)*Math.abs(k)*1.6;teeth.push({x:cx+k*(tw+3),y:cy+(r?th*.55+6:-th*.55-6)+(r?-curve:curve),w:tw*(1-Math.abs(k)*.04),h:th*(1-Math.abs(k)*.05),dirt:1,low:r,spots:[...Array(5)].map(()=>({a:R(),b:R(),s:R()*.4+.3}))})}}
function smileDraw(){const cx=W/2,cy=H*.58,mw=Math.min(W*.92,420),mh=mw*.62;
x.save();x.beginPath();x.ellipse(cx,cy,mw/2,mh/2,0,0,7);const lg=x.createRadialGradient(cx,cy,10,cx,cy,mw/2);lg.addColorStop(0,"#5a0f1a");lg.addColorStop(1,"#2a0509");x.fillStyle=lg;x.fill();
x.lineWidth=18;x.strokeStyle="#d9566b";x.stroke();x.lineWidth=6;x.strokeStyle="#f08a9a";x.stroke();x.clip();
x.fillStyle="#e07a88";x.beginPath();x.ellipse(cx,cy-mh*.42,mw*.45,mh*.16,0,0,7);x.fill();x.beginPath();x.ellipse(cx,cy+mh*.42,mw*.45,mh*.16,0,0,7);x.fill();
teeth.forEach(T=>{const rx=T.x-T.w/2,ry=T.y-T.h/2;const g=x.createLinearGradient(rx,ry,rx+T.w,ry+T.h);g.addColorStop(0,"#ffffff");g.addColorStop(1,"#e9eef5");x.fillStyle=g;rr(rx,ry,T.w,T.h,T.w*.35);x.fill();
if(T.dirt>0){x.globalAlpha=T.dirt*.85;T.spots.forEach(s=>{x.fillStyle="#c9a14a";x.beginPath();x.ellipse(rx+T.w*s.a,ry+T.h*s.b,T.w*s.s*.6,T.h*s.s*.4,0,0,7);x.fill()});x.fillStyle="rgba(190,150,60,.55)";rr(rx,ry,T.w,T.h,T.w*.35);x.fill();x.globalAlpha=1}
else{x.fillStyle="rgba(255,255,255,"+(.5+.5*Math.sin(t*6+T.x))+")";star(rx+T.w*.7,ry+T.h*.3,T.w*.18)}});
x.restore();
if(ptr.down||FILM){x.save();x.translate(ptr.x,ptr.y);x.rotate(-.5);x.fillStyle="#3aa0ff";rr(-8,0,16,120,8);x.fill();x.fillStyle="#fff";rr(-14,-34,28,40,6);x.fill();x.fillStyle="#7fd0ff";for(let i=0;i<4;i++)rr(-12+i*7,-48,5,16,2),x.fill();x.restore();
for(let i=0;i<3;i++){x.fillStyle="rgba(255,255,255,.7)";x.beginPath();x.arc(ptr.x+Math.sin(t*20+i*2)*18,ptr.y-30+Math.cos(t*17+i)*12,4+i,0,7);x.fill()}}}
function smileStep(dt){if(ptr.down||FILM)teeth.forEach(T=>{const dx=ptr.x-T.x,dy=(ptr.y-28)-T.y;if(dx*dx+dy*dy<(T.w*1.1)**2)T.dirt=Math.max(0,T.dirt-dt*1.3)});prog=1-teeth.reduce((a,T)=>a+T.dirt,0)/teeth.length}
/* ===== Игра 2: капли ===== */
let drops=[],jar={x:0},spawn=0;
const GOOD=[["Гиалурон","#6ad3ff"],["Витамин C","#ffb347"],["Коллаген","#ff8fc8"],["Пептиды","#a98cff"]],BAD=["Стресс","Недосып","Солнце"];
function glowStep(dt){spawn-=dt;if(spawn<0){spawn=.42;const g=R()<.72;const d=g?GOOD[Math.floor(R()*4)]:BAD[Math.floor(R()*3)];drops.push({x:W*(.12+R()*.76),y:200,v:H*(.28+R()*.12),g,l:g?d[0]:d,c:g?d[1]:"#7d8796"})}
if(FILM){const tg=drops.filter(d=>d.g&&d.y<H*.82).sort((a,b)=>b.y-a.y)[0];if(tg)jar.x+=(tg.x-jar.x)*Math.min(1,dt*5)}else jar.x+=(ptr.x-jar.x)*Math.min(1,dt*12);
const jy=H*.82;drops.forEach(d=>{d.y+=d.v*dt;if(!d.hit&&d.y>jy-40&&d.y<jy+10&&Math.abs(d.x-jar.x)<55){d.hit=1;if(d.g)prog=Math.min(1,prog+.075);else prog=Math.max(0,prog-.05);burst(d.x,d.y,d.c)}});drops=drops.filter(d=>!d.hit&&d.y<H+40)}
function glowDraw(){const jy=H*.82;drops.forEach(d=>{x.save();x.translate(d.x,d.y);x.shadowColor=d.c;x.shadowBlur=d.g?18:0;x.fillStyle=d.c;x.beginPath();x.moveTo(0,-22);x.bezierCurveTo(16,-2,16,16,0,18);x.bezierCurveTo(-16,16,-16,-2,0,-22);x.fill();x.shadowBlur=0;x.fillStyle="#fff";x.font="700 11px Montserrat";x.textAlign="center";x.fillText(d.l,0,34);x.restore()});
const jx=jar.x;x.save();x.translate(jx,jy);x.shadowColor="#ffd76a";x.shadowBlur=prog*40;x.fillStyle="rgba(255,255,255,.18)";rr(-52,-40,104,80,18);x.fill();x.shadowBlur=0;x.strokeStyle="rgba(255,255,255,.7)";x.lineWidth=3;rr(-52,-40,104,80,18);x.stroke();
x.save();rr(-50,-38,100,76,16);x.clip();const fh=76*prog;const g=x.createLinearGradient(0,38,0,38-fh);g.addColorStop(0,"#ff8fc8");g.addColorStop(1,"#ffe9a8");x.fillStyle=g;x.fillRect(-50,38-fh,100,fh);x.restore();
x.fillStyle="#f2d7e6";rr(-46,-60,92,22,8);x.fill();x.fillStyle="#2a1030";x.font="800 11px Montserrat";x.textAlign="center";x.fillText("СИЯНИЕ",0,-45);x.restore()}
/* ===== Игра 3: блюда ===== */
let food=[],tray={x:0},caught=[];
const DISH=["🥩","🍰","🍗","🥗","🍕","🍣","🍤","🧁"];
function chefStep(dt){spawn-=dt;if(spawn<0){spawn=.78;const bad=R()<.25;food.push({x:W*(.12+R()*.76),y:200,v:H*(.25+R()*.12),bad,e:bad?"🔥":DISH[Math.floor(R()*DISH.length)],r:R()*6})}
if(FILM){const tg=food.filter(d=>!d.bad&&d.y<H*.8).sort((a,b)=>b.y-a.y)[0];if(tg)tray.x+=(tg.x-tray.x)*Math.min(1,dt*5)}else tray.x+=(ptr.x-tray.x)*Math.min(1,dt*12);
const ty=H*.8;food.forEach(d=>{d.y+=d.v*dt;d.r+=dt*2;if(!d.hit&&d.y>ty-34&&d.y<ty+6&&Math.abs(d.x-tray.x)<62){d.hit=1;if(!d.bad){caught.push(d.e);burst(d.x,d.y,"#ffd76a")}else{caught.pop();burst(d.x,d.y,"#ff4a2a")}prog=Math.min(1,caught.length/8)}});food=food.filter(d=>!d.hit&&d.y<H+40)}
function chefDraw(){const ty=H*.8,tb=H*.92;x.fillStyle="#7a3b14";rr(W*.06,tb,W*.88,H*.05,10);x.fill();x.fillStyle="#fff";rr(W*.08,tb-8,W*.84,10,5);x.fill();
caught.forEach((e,i)=>{x.font="30px 'Noto Color Emoji',sans-serif";x.textAlign="center";x.fillText(e,W*.14+i*(W*.72/7),tb-12)});
food.forEach(d=>{x.save();x.translate(d.x,d.y);x.rotate(Math.sin(d.r)*.3);x.font="44px 'Noto Color Emoji',sans-serif";x.textAlign="center";x.textBaseline="middle";if(d.bad){x.shadowColor="#ff4a2a";x.shadowBlur=20}x.fillText(d.e,0,0);x.restore()});
x.save();x.translate(tray.x,ty);x.fillStyle="#d9d9d9";x.beginPath();x.ellipse(0,0,66,14,0,0,7);x.fill();x.fillStyle="#f5f5f5";x.beginPath();x.ellipse(0,-3,58,10,0,0,7);x.fill();x.restore()}
/* общее */
let parts=[];function burst(px,py,c){for(let i=0;i<14;i++)parts.push({x:px,y:py,vx:(R()-.5)*260,vy:(R()-1)*260,l:.7,c})}
function partsStep(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);parts.forEach(p=>{x.globalAlpha=Math.max(0,p.l/.7);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3.5,0,7);x.fill()});x.globalAlpha=1}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function star(a,b,s){x.save();x.translate(a,b);x.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.3:s;x.lineTo(Math.cos(i*Math.PI/4)*r,Math.sin(i*Math.PI/4)*r)}x.closePath();x.fill();x.restore()}
const STEP={smile:smileStep,glow:glowStep,chef:chefStep}[G],DRAW={smile:smileDraw,glow:glowDraw,chef:chefDraw}[G];
function init(){t=0;prog=0;done=false;drops=[];food=[];caught=[];jar.x=W/2;tray.x=W/2;if(G==="smile")initSmile()}
init();
/* автопилот для съёмки */
function film(dt){if(G==="smile"){const k=t*1.25,cx=W/2,cy=H*.58,sp=Math.min(W*.92,420)*.42;ptr.x=cx+Math.sin(k*2.1)*sp;ptr.y=cy+28+(Math.sin(k*.9)>0?-1:1)*H*.045+Math.cos(k*4)*10}}
function frame(dt){t+=dt;bg();if(run&&!done){if(FILM)film(dt);STEP(dt);const left=Math.max(0,TL-t);document.getElementById("tm").textContent=Math.ceil(left);if(prog>=.999||left<=0)win()}else if(!run&&G==="smile"&&FILM){} DRAW();partsStep(dt);document.getElementById("bar").style.width=(prog*100)+"%"}
function win(){done=true;prog=Math.max(prog,1);if(prog<.6){}const w=document.getElementById("win");w.style.display="flex";if(navigator.vibrate)try{navigator.vibrate([30,40,60])}catch(e){}}
document.getElementById("go").onclick=()=>{document.getElementById("start").style.display="none";init();run=true};
const pd=e=>{const p=e.touches?e.touches[0]:e;ptr.x=p.clientX;ptr.y=p.clientY};
addEventListener("pointerdown",e=>{ptr.down=true;pd(e)});addEventListener("pointermove",pd);addEventListener("pointerup",()=>ptr.down=false);
if(FILM){window.startFilm=()=>{document.getElementById("start").style.display="none";init();run=true};window.tick=dt=>frame(dt);frame(0)}
else{let last=performance.now();(function L(n){frame(Math.min(.05,(n-last)/1000));last=n;requestAnimationFrame(L)})(last)}
</script>
</body>
</html>
