<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своё место — игра Венеры Татиной</title>
<style>
:root{--bg:#162545;--bg2:#1b3058;--box:#1a2d50;--bord:#2a4070;--gold:#c9a84c;--tx:#ddeeff;--dim:#a0bcd8;--red:#3a1a1a;--redl:#c0392b;--grn:#1e3820;--grnl:#3a7d44;--grnt:#a0e0a8;--vio:#a98cff;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:17px/1.5 Calibri,Carlito,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:9;width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:rgba(22,37,69,.85);color:var(--gold);font-size:19px;cursor:pointer}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--gold);line-height:1.2;margin:0 0 12px}
h1{font-size:34px;text-align:center}h2{font-size:24px}
.badge{display:block;width:fit-content;margin:0 auto 18px;border:1px solid var(--gold);background:var(--bg2);color:var(--gold);padding:4px 14px;font-size:13px;font-weight:700;letter-spacing:.06em}
.bar{display:flex;gap:5px;margin:0 0 16px}.bar i{flex:1;height:4px;background:var(--bord);border-radius:2px}.bar i.on{background:var(--gold)}
.div{display:flex;align-items:center;gap:10px;color:var(--gold);margin:14px 0}.div:before,.div:after{content:"";flex:1;height:1px;background:var(--gold);opacity:.5}
p{margin:0 0 12px}.dim{color:var(--dim)}
.box{background:var(--box);border:1px solid var(--bord);border-left:5px solid var(--gold);padding:14px 16px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--box);border:1px solid var(--bord);color:var(--tx);font:inherit;padding:13px 15px;margin:0 0 9px;cursor:pointer;border-radius:6px;transition:transform .12s,border-color .2s}
.opt:active{transform:scale(.98)}
.opt:hover{border-color:var(--gold)}.opt.sel{border-color:var(--gold);background:var(--bg2);box-shadow:inset 4px 0 var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.chip{flex:1 1 auto;min-width:46%;text-align:center;margin:0}
.chip.add{min-width:30%;font-size:15px;padding:9px 8px;border-style:dashed}
.btn{display:block;width:100%;background:var(--gold);color:var(--bg);border:0;font:700 18px Georgia,serif;padding:15px;margin-top:16px;cursor:pointer;border-radius:6px;text-decoration:none;text-align:center}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 22px rgba(201,168,76,.55)}}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
textarea{width:100%;background:var(--box);border:1px solid var(--bord);color:var(--tx);font:inherit;padding:12px;border-radius:6px;margin:0 0 12px}
.note{background:var(--grn);border:1px solid var(--grnl);color:var(--grnt);padding:11px 14px;margin:6px 0 12px;border-radius:6px}
.warn{background:var(--red);border:1px solid var(--redl);color:#f3b0a8;padding:11px 14px;margin:6px 0 12px;border-radius:6px}
.fig{font-weight:700;color:var(--gold);margin:0 0 6px}
.sl{margin:0 0 18px}.sl label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.sl b{font:700 26px Georgia,serif;color:var(--gold)}.sl input{width:100%;accent-color:#c9a84c}
.vp{margin:0 0 14px}.vp button{display:flex;align-items:center;gap:10px;width:100%;background:linear-gradient(90deg,#2a2160,#1b3058);border:1px solid var(--vio);color:var(--tx);font:700 16px Calibri,sans-serif;padding:11px 14px;border-radius:30px;cursor:pointer}
.vp i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--vio);color:#1a1440;font-style:normal}
.vp .wv{flex:1;height:14px;background:repeating-linear-gradient(90deg,rgba(169,140,255,.6) 0 3px,transparent 3px 7px);opacity:.5;border-radius:3px}
.vp.play .wv{animation:wv 1s linear infinite;opacity:1}@keyframes wv{to{background-position:14px 0}}
/* поле */
#fld{position:relative;border:1px dashed var(--gold);border-radius:10px;background:radial-gradient(circle at 50% 40%,#1f3866,#101c36);margin:0 0 10px;overflow:hidden;touch-action:none}
.fg{position:absolute;width:76px;height:96px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:filter .2s}
.fg svg{display:block;width:36px;height:47px;margin:7px auto 0;filter:drop-shadow(0 0 8px rgba(201,168,76,.35))}
.fg b{display:block;font:700 11px/1.05 Calibri,sans-serif;text-align:center;color:#fff;text-shadow:0 1px 3px #000;margin-top:12px}
.gz{position:absolute;left:50%;top:30px;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:1px dashed rgba(201,168,76,.4);pointer-events:none;transition:transform .25s}
.gz:before{content:"";position:absolute;left:50%;top:-9px;margin-left:-7px;border:7px solid transparent;border-bottom:11px solid var(--gold);border-top:0}
.fg.on .gz{border:2px solid #fff}.fg.on{filter:brightness(1.25)}
.fg.pop svg{animation:pop .35s}@keyframes pop{50%{transform:scale(1.18)}}
.rotb{display:flex;gap:10px;justify-content:center;margin:0 0 6px}.rotb button{min-width:54px;height:44px;font-size:20px;border-radius:24px;border:0;background:var(--gold);color:var(--bg);cursor:pointer;padding:0 12px}
.hint{font-size:14px;text-align:center;color:var(--dim);margin:0 0 8px}
/* выход */
.hold{width:170px;height:170px;border-radius:50%;margin:20px auto;display:grid;place-items:center;font:700 18px Georgia,serif;color:var(--tx);border:0;cursor:pointer;touch-action:none;user-select:none;background:conic-gradient(var(--gold) 0deg,var(--bord) 0deg)}
.hold span{background:var(--bg);width:146px;height:146px;border-radius:50%;display:grid;place-items:center;padding:10px}
.phrase{font:italic 700 21px/1.4 Georgia,serif;color:var(--gold);margin:6px 0 14px;text-align:center}
/* финал */
.reveal{display:grid;place-items:center;gap:10px;width:100%;min-height:260px;margin:10px 0;border:2px solid var(--gold);border-radius:14px;background:radial-gradient(circle,#2b2170,#162545);color:var(--tx);font:700 19px Georgia,serif;cursor:pointer;animation:glow 2s ease-in-out infinite}
.reveal span{font-size:54px;color:var(--gold);animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.flip{animation:flip .7s ease}@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.lock{display:block;width:100%;text-align:left;background:#14213f;border:1px solid var(--vio);border-radius:8px;color:var(--tx);font:inherit;padding:13px 15px 13px 50px;margin:0 0 9px;cursor:pointer;position:relative}
.lock:before{content:"🔒";position:absolute;left:15px;top:12px;font-size:20px}
.lock small{display:none;color:var(--vio);margin-top:6px}.lock.open small{display:block}
.lock.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.offer{border-left-color:var(--vio)}
details summary{cursor:pointer;color:var(--gold);font-weight:700}
.res{white-space:pre-wrap;font-size:15px}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.btn.glow,.reveal,.reveal span{animation:none}}
</style>
</head>

<div class="wrap"><div id="app"></div></div>
<script>
/* ===== ДАННЫЕ МЕТОДИКИ (без изменений из v3) ===== */
const LOY={
copy:{n:"Я как ты",need:"повторять твою судьбу",what:"Ты повторяешь путь мамы, папы или предка: так принадлежишь своему роду.",money:"Деньги идут по сценарию рода: сколько было у родителей, столько и удерживается.",rel:"Повторяются те же партнёры и те же истории, что были у мамы или папы.",body:"Те же болезни и те же возрасты, что в роду по линии мамы или бабушки.",ask:"Кто в роду был несчастлив в браке или жил так же, как ты сейчас?",ph:"Мама, я вижу твою судьбу. Я оставляю тебе твою судьбу. А свою жизнь я выбираю прожить по-другому."},
instead:{n:"Я вместо тебя",need:"нести твою боль",what:"Ты берёшь на себя чужую судьбу и чужую боль: «я болею, чтобы ты могла жить».",money:"Силы и деньги уходят на чужие проблемы, на свою жизнь не остаётся.",rel:"Ты растворяешься в партнёре или семье и теряешь себя.",body:"Болезнь и усталость как способ нести чужое.",ask:"Чью боль или болезнь из рода ты несёшь вместо кого-то?",ph:"У тебя отдельная судьба. У меня отдельная судьба. Я остаюсь в своей жизни."},
better:{n:"Лучше я, чем ты",need:"тащить за тебя твою ношу",what:"Ты берёшь чужую ответственность и чужой крест: «пусть я, лишь бы тебе было легче».",money:"Ты тянешь семью и долги на себе, а деньги приходят и уходят на других.",rel:"Ты всё тянешь одна, партнёр расслабляется и не берёт ответственность.",body:"Хроническая усталость: энергия уходит на удержание чужого.",ask:"Кто в роду всё тащил на себе и кого ты стремишься облегчить?",ph:"Ты справишься. У тебя есть сила. Я возвращаю тебе твою."},
down:{n:"Равнение вниз",need:"жить не лучше, чем ты",what:"Бессознательно ты не позволяешь себе жить лучше, чем жили в роду: «раз у вас так, то и мне нельзя».",money:"Деньги приходят и сразу уходят, чек упирается в потолок «как у наших».",rel:"Рядом оказываются те, рядом с кем не придётся «выходить выше» семьи.",body:"Тело останавливает на подъёме: болезнь или усталость перед важным шагом.",ask:"Кто в роду жил в нехватке и перед кем неловко жить лучше?",ph:"Я уважаю ваш путь. И я разрешаю себе жить по-другому."},
excl:{n:"Судьба исключённого",need:"помнить и нести того, кого отвергли",what:"Если в роду кого-то отвергли или забыли, его судьбу повторяют: в памяти рода «успех = беда».",money:"Страх больших денег и успеха: «богатство, значит, трагедия».",rel:"Страх потерять и тревога, когда становится хорошо.",body:"Тревога и страх в теле при росте: это память рода.",ask:"Кого в роду отвергли, забыли или осудили?",ph:"Я вижу тебя. Ты принадлежишь нашей системе. Я возвращаю тебя в поле."},
guilt:{n:"Успех через вину",need:"страдать вместе с тобой",what:"Ты связываешь своё счастье с чужой неудачей: «раз ты страдал, мне тоже нельзя».",money:"После успеха приходят потери: поле выравнивает вину деньгами.",rel:"Счастье в отношениях вызывает вину перед мамой или папой.",body:"Болезни и срывы именно тогда, когда всё начинает получаться.",ask:"Кто в роду страдал, пока тебе хочется, чтобы стало хорошо?",ph:"Я вижу вашу боль. И выбираю жить с любовью и лёгкостью. Это не против вас. Это благодаря вам."},
poor:{n:"Нехватка, как у предков",need:"жить в нехватке, как жили вы",what:"Деньги «жгут руки»: убеждение, что хотеть большего значит предать тех, у кого не было.",money:"Деньги уходят сразу, как приходят: траты появляются после прихода дохода.",rel:"Хватит и малого: ты не просишь и не принимаешь больше.",body:"Усталость и ощущение «не заслужила».",ask:"Кто в роду постоянно жил в нехватке?",ph:"Я могу больше. Это не предательство. Мой достаток уважает путь рода."},
pain:{n:"Успех через страдание",need:"добывать всё через боль",what:"Внутри живёт установка, что деньги и любовь достаются только через труд и боль.",money:"Ты работаешь много, получаешь мало, и вина, если стало легко.",rel:"Любовь связана с борьбой, спокойные отношения кажутся «ненастоящими».",body:"Работа на износ и выгорание при хорошем доходе.",ask:"Кто в роду всё добывал тяжёлым трудом и страданием?",ph:"Мне можно получать без боли. Любовь не требует страдания."},
par:{n:"Нельзя превзойти маму или папу",need:"не быть счастливее и успешнее тебя",what:"Из страха «предать» ты тормозишь свой рост и повторяешь их ошибки.",money:"Ты не позволяешь себе стать успешнее мамы или папы.",rel:"Сильный партнёр «делает слабым» папу, и рядом выбирается тот, кто «не дотягивает».",body:"Рост и видимость сопровождаются телесным откатом.",ask:"Чью судьбу из родителей ты боишься превзойти?",ph:"Мама, папа, я вижу, как сложилась ваша жизнь. Я уважаю ваш путь. А свою реализацию я беру себе."},
marr:{n:"Или семья, или деньги",need:"выбирать между семьёй и деньгами",what:"Сценарий «или семья, или деньги»: страх, что успех разрушит отношения.",money:"Стеклянный потолок именно тогда, когда дела идут хорошо.",rel:"Страх зарабатывать больше партнёра, страх, что успех разрушит пару.",body:"Напряжение в теле, когда доход растёт.",ask:"Кто в роду потерял семью или деньги, когда пошёл вверх?",ph:"У него своя система денег. У меня своя. Это не нарушает нашу гармонию, а усиливает её. Мне можно иметь и деньги, и любовь."},
hide:{n:"Не высовываться",need:"не высовываться",what:"Часть тебя уверена, что быть заметной опасно: могут осудить, позавидовать, отвергнуть.",money:"Ты занижаешь цену, откладываешь проявленность и стесняешься называть сумму.",rel:"Ты подстраиваешься и сжимаешься рядом с теми, кто «громче».",body:"Зажимы в горле и спине, когда нужно проявиться.",ask:"Кто в роду пострадал за то, что высунулся?",ph:"Я могу быть видимой и проявленной. Это не предательство моего рода."},
relig:{n:"Бедность = святость",need:"считать деньги грехом",what:"«Деньги грех, богатые нечестные»: страх, что изобилие нарушение перед Богом.",money:"Стыд за большой доход и неловкость, когда хвалят за заработок.",rel:"Стыд за «слишком хорошую» жизнь рядом с близкими.",body:"Напряжение и неловкость в теле при разговоре о деньгах.",ask:"Какие слова о деньгах и грехе звучали в твоём роду?",ph:"Изобилие не грех. Это форма жизни."}};
const AREAS=["Деньги","Отношения","Здоровье и тело","Предназначение","Семья и род","Внутреннее состояние"];

["Что происходит, когда денег становится больше?",[["Неловко брать и принимать помощь: «я сама»","better"],["Стыдно, когда хвалят за заработок","relig"],["Неловко зарабатывать больше партнёра","marr"],["Жду, что всё отнимется","excl"]]],
["Что ты делаешь с деньгами, когда они приходят?",[["Сразу отдаю или трачу на других","better"],["Прячу и боюсь потерять","excl"],["Откладываю на чёрный день, жить нечем","poor"],["Трачу, чтобы не было больше, чем у родных","down"]]],
["Как ты называешь свою цену?",[["Занижаю, чтобы не осудили","hide"],["Объясняю и оправдываюсь","pain"],["Не прошу больше, пока не заслужу","pain"],["Работаю бесплатно, а деньги прошу потом","better"]]]],

["Что происходит, когда близость становится глубже?",[["Теряю себя, растворяюсь в партнёре","instead"],["Жду, что он уйдёт или предаст","excl"],["Хочется всё разрушить самой","copy"],["Начинаю учить и спасать","better"]]],
["Что внутри говорит про брак?",[["Семья — это терпение, как у мамы","pain"],["Или семья, или своя жизнь","marr"],["Мне нельзя быть счастливее мамы","guilt"],["Не получу больше, чем у родителей","down"]]],

function audioStart(){if(AU.ctx){AU.on=true;mvol();upd();return}try{const C=new(window.AudioContext||window.webkitAudioContext)();AU.ctx=C;const m=C.createGain();m.gain.value=0;const lp=C.createBiquadFilter();lp.type="lowpass";lp.frequency.value=650;lp.Q.value=.6;lp.connect(m);m.connect(C.destination);const lfo=C.createOscillator(),lg=C.createGain();lfo.frequency.value=.06;lg.gain.value=220;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
AU.osc=[0,1,2,3].map(i=>{const o=C.createOscillator();o.type=i%2?"triangle":"sine";o.detune.value=(i-1.5)*5;const g=C.createGain();g.gain.value=i===0?.45:.2;o.connect(g);g.connect(lp);o.start();return o});AU.m=m;AU.on=true;chord(S.step);mvol();upd()}catch(e){}}
function chord(n){if(!AU.ctx)return;const c=n>=10?CH[7]:CH[n%7],t=AU.ctx.currentTime;AU.osc.forEach((o,i)=>o.frequency.setTargetAtTime(c[i],t,1.2))}
function mvol(){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.m.gain.cancelScheduledValues(t);AU.m.gain.setTargetAtTime(AU.on?(AU.duck?.025:.1):0,t,.7)}
function chime(f,v){if(!AU.on||!AU.ctx)return;try{const C=AU.ctx,o=C.createOscillator(),g=C.createGain(),t=C.currentTime;o.type="sine";o.frequency.value=f||880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.5);o.connect(g);g.connect(C.destination);o.start(t);o.stop(t+1.6)}catch(e){}}

el.addEventListener("pointermove",e=>{if(!d)return;const r=f.getBoundingClientRect(),o=S[nm][k];o.x=Math.min(.93,Math.max(.07,(e.clientX-r.left)/r.width));o.y=Math.min(.8,Math.max(.1,(e.clientY-r.top)/r.height));S.moved=1;mv=true;place(k);chk()});
["pointerup","pointercancel"].forEach(v=>el.addEventListener(v,()=>{if(d&&mv){chime(440+Math.random()*220,.06);liveNote()}d=false}))});
const rot=dg=>{if(!S.sel){const c=document.getElementById("live")||document.getElementById("an8");return}S[nm][S.sel].a+=dg;S.moved=1;place(S.sel);chk();vib(10);chime(560,.05);liveNote()};
document.getElementById("rl").onclick=()=>rot(-45);document.getElementById("rr").onclick=()=>rot(45);document.getElementById("r180").onclick=()=>rot(180);chk()}
function readField(){const f=document.getElementById("fld");if(!f)return;const W=f.clientWidth,H=f.clientHeight,me=S.fig.me;
const ang=(a,b)=>Math.atan2((b.x-a.x)*W,-(b.y-a.y)*H)*180/Math.PI;
const cat=k=>{const o=S.fig[k];if(Math.abs(nrm(o.a-ang(o,me)))>110)return 3;const r=nrm(ang(me,o)-me.a);if(Math.abs(r)<60)return 2;return r>0?1:0};
S.pm=cat("mm");S.pp=cat("pp");S.rqBack=Math.abs(nrm(ang(me,S.fig.rq)-me.a))>=120}

/* ----- фон ----- */
(function(){const c=document.getElementById("bg"),x=c.getContext("2d");let W,H,t=0,mx=.5,my=.5,pulse=0;const dpr=Math.min(2,devicePixelRatio||1),rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const size=()=>{W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle="#0a0820";x.fillRect(0,0,W,H)};
const R=[];for(let i=0;i<12;i++)R.push({cx:Math.random(),cy:Math.random(),r:.18+Math.random()*.35,a:Math.random()*6.28,sw:1.2+Math.random()*2.2,w:(Math.random()<.5?-1:1)*(.0015+Math.random()*.003),h:245+Math.random()*75,ph:Math.random()*6.28,k:10+(Math.random()*8|0)});
size();addEventListener("resize",size);addEventListener("pointermove",e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});addEventListener("pointerdown",()=>{pulse=1});
function step(){t+=1;x.globalCompositeOperation="source-over";x.fillStyle="rgba(10,8,32,.14)";x.fillRect(0,0,W,H);x.globalCompositeOperation="lighter";pulse*=.96;const m=Math.min(W,H);
for(const q of R){q.a+=q.w*(1+pulse*4);const cx=(q.cx+(mx-q.cx)*.06+Math.sin(t*.003+q.ph)*.04)*W,cy=(q.cy+(my-q.cy)*.06+Math.cos(t*.0027+q.ph)*.04)*H,r=q.r*m*(1+Math.sin(t*.004+q.ph)*.06+pulse*.1);
for(let j=0;j<q.k;j++){const f=j/q.k,s0=q.a+f*.5,e0=s0+1.3+Math.sin(t*.005+j)*.25;x.beginPath();x.arc(cx,cy,r*(1+f*.12),s0,e0);x.lineWidth=q.sw*(1-f*.6);x.strokeStyle=`hsla(${q.h+f*40},85%,${55+f*25}%,${.05+.05*(1-f)})`;x.stroke()}
const ea=q.a+1.3,ex=cx+Math.cos(ea)*r,ey=cy+Math.sin(ea)*r;x.beginPath();x.arc(ex,ey,2.2,0,6.283);x.fillStyle="rgba(235,225,255,.35)";x.fill()}}
if(rm){for(let i=0;i<160;i++)step()}else{(function loop(){step();requestAnimationFrame(loop)})()}})();
render();
</script>
