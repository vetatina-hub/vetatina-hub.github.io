["mm","pp"].forEach(k=>{const X=S[k];if(X.dist==="far")add("far",k);
if(X.post==="sit"||X.post==="lie")add("sitlie",k,X.post==="sit"?"сидит":"лежит");if(X.post==="wob"&&k==="mm")add("wob",k);if(X.post==="wall"&&!bothWall)add("wall",k);if(X.post==="lean")add("lean",k);if(X.post==="spin")add("spin",k);

if(k==="mm"&&["side","away"].includes(X.gaze))add("side_mm",k);
if(X.size==="small")add("small",k);if(X.size==="clear")add("clear",k);if(X.size==="big")add("big",k);
if(X.face==="sad"&&k==="mm")add("sad",k);if(X.face==="strict")add("strict",k);if(X.face==="eval")add("eval",k);if(X.face==="cover")add("cover",k);
if(X.feel.includes("anger"))add("anger",k);if(X.feel.includes("pity")&&k==="pp")add("pity",k);if(X.feel.includes("love"))add("love",k)});
if(M.gaze==="other"&&P.gaze==="other")add("eachother");

const looks=g=>g==="me"||g==="both"||g==="through";
