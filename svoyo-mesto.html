const angTo=(a,b)=>Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;

function ppos(k){const X=S[k];if(!X.pos)return null;let[x,y]=PXY[X.pos];const o=S[k==="mm"?"pp":"mm"];if(o.pos===X.pos)x+=k==="mm"?-10:10;const f=X.dist==="far"?1.5:X.dist==="near"?.7:1;return[cl(ME[0]+(x-ME[0])*f),cl(ME[1]+(y-ME[1])*f)]}
function arrow(p,a,L,dash,col){L*=1.35;{const r0=a*Math.PI/180;p=[p[0]+Math.sin(r0)*6,p[1]-Math.cos(r0)*6]}const r=a*Math.PI/180,x2=p[0]+Math.sin(r)*L,y2=p[1]-Math.cos(r)*L,h=2.4,l=a*Math.PI/180;const hx1=x2-Math.sin(l-.5)*h,hy1=y2+Math.cos(l-.5)*h,hx2=x2-Math.sin(l+.5)*h,hy2=y2+Math.cos(l+.5)*h;return `<line x1="${p[0]}" y1="${p[1]}" x2="${x2}" y2="${y2}" stroke="${col||"#c9a84c"}" stroke-width=".9" ${dash?'stroke-dasharray="1.6 1.2"':""}/><polygon points="${x2},${y2} ${hx1},${hy1} ${hx2},${hy2}" fill="${col||"#c9a84c"}"/>`}
function person(p,col,post,sc,op,lab,glyph){sc=(sc||1)*1.45;let b="",rot=0;const head=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="2.9" fill="${col}"/>`;

else if(post==="sit")b=head(0,-3.5)+`<path d="M-3.8 3 Q-3.8 -.6 0 -.6 Q3.8 -.6 3.8 3 Z" fill="${col}"/><line x1="-5" y1="3.6" x2="5" y2="3.6" stroke="${col}" stroke-width=".8"/>`;
else{b=head(0,-5.2)+`<path d="M-3.8 4.8 Q-3.8 -1.6 0 -1.6 Q3.8 -1.6 3.8 4.8 Z" fill="${col}"/>`;if(post==="wob"||post==="wave"||post==="lean")rot=post==="lean"?-12:14;}
let ex="";if(post==="wall")ex=`<line x1="-6.5" y1="-9" x2="-6.5" y2="6" stroke="#8aa0c0" stroke-width="1.4"/>`;if(post==="spin")ex=`<circle r="8" fill="none" stroke="${col}" stroke-width=".5" stroke-dasharray="2 1.5"/>`;if(post==="wob")ex=`<text x="6" y="-3" font-size="4" fill="${col}">≈</text>`;if(post==="wave")ex=`<text x="4" y="-6" font-size="4">👋</text>`;if(post==="open")ex=`<path d="M-6 -2 L-3.8 0 M6 -2 L3.8 0" stroke="${col}" stroke-width="1"/>`;

function pgaze(k,p){const X=S[k],m=ME,o=ppos(k==="mm"?"pp":"mm");const tm=angTo(p,m);switch(X.gaze){case"me":return arrow(p,tm,9);case"other":return o?arrow(p,angTo(p,o),8):"";case"both":return arrow(p,tm,9)+(o?arrow(p,angTo(p,o),8):"");case"front":return arrow(p,tm,7,1);case"side":return arrow(p,tm+90,8);case"away":return arrow(p,tm+180,8);case"far":return arrow(p,tm+180,14,1);case"door":{const a=p[0]<50?270:90;return arrow(p,a,12,1)+`<rect x="${a===90?96:1}" y="${p[1]-5}" width="3" height="10" fill="#8aa0c0"/>`}case"through":return arrow(p,tm,22,1);case"down":return `<text x="${p[0]+5}" y="${p[1]+4}" font-size="3.4" fill="#f3b0a8">↓ в пол</text>`}return""}

if(a!==null)s+=arrow(ME,a,L,d,"#ffffff");if(g==="wall")s+=`<line x1="4" y1="40" x2="4" y2="70" stroke="#8aa0c0" stroke-width="1.6"/>`;if(g==="down")s+=`<text x="55" y="60" font-size="3.4" fill="#f3b0a8">↓ в пол</text>`;

function lifeLayout(p,ideal){const L=S.life,items=["mon","rlz"].concat(L.kids==="yes"?["kids"]:[]).concat(L.prt&&L.prt!=="no"?["prt"]:[]);const F=[];const lab={mon:"Деньги",rlz:"Моё дело",kids:"Дети",prt:"Партнёр"},gl={mon:"₸",rlz:"★",kids:"✿",prt:"♥"};const behind=[];

const front={mon:[24,20],rlz:[76,20],kids:[50,26],prt:[71,52]},back={mon:[22,90],rlz:[78,90]};items.forEach(k=>{const bad=!ideal&&((k==="mon"&&(L.mon||[]).some(x=>["tight","debt","flow"].includes(x)))||(k==="rlz"&&["delay","lost"].includes(L.rlz)));const q=bad?back[k]:front[k];if(bad)behind.push(lab[k]);F.push({k,x:q[0],y:q[1],a:0,lab:lab[k],gl:gl[k]})})}

function decode(){const M=S.mm,P=S.pp,me=S.me,R=[];const front=z=>["front","fl","fr"].includes(z);const add=(id,k,extra)=>R.push({id,k:k||"mm",post:extra});

const bothWall=M.post==="wall"&&P.post==="wall"&&me.gaze==="wall";
["mm","pp"].forEach(k=>{const X=S[k];if(X.dist==="far")add("far",k);
if(X.post==="sit"||X.post==="lie")add("sitlie",k,X.post==="sit"?"сидит":"лежит");if(X.post==="wob"&&k==="mm")add("wob",k);if(X.post==="wall"&&!bothWall)add("wall",k);if(X.post==="lean")add("lean",k);if(X.post==="spin")add("spin",k);
if(X.gaze==="down")add("down",k);if(X.gaze==="door")add("door",k);if(X.gaze==="through")add("through",k);if(X.gaze==="far")add("gfar",k);if(X.gaze==="both")add("mboth",k);
if(k==="mm"&&["side","away"].includes(X.gaze))add("side_mm",k);
if(X.size==="small")add("small",k);if(X.size==="clear")add("clear",k);if(X.size==="big")add("big",k);
if(X.face==="sad"&&k==="mm")add("sad",k);if(X.face==="strict")add("strict",k);if(X.face==="eval")add("eval",k);if(X.face==="cover")add("cover",k);
if(X.feel.includes("anger"))add("anger",k);if(X.feel.includes("pity")&&k==="pp")add("pity",k);if(X.feel.includes("love"))add("love",k)});
if(M.gaze==="other"&&P.gaze==="other")add("eachother");
if(M.gaze==="me"&&P.gaze==="me")add("atme");
const looks=g=>g==="me"||g==="both"||g==="through"||g==="front";
if(M.gaze&&P.gaze&&!looks(M.gaze)&&!looks(P.gaze)&&!(M.gaze==="other"&&P.gaze==="other"))add("nolook");
else if(["side","away"].includes(P.gaze))add("away_pp","pp");
if(M.feel.includes("nothing")&&P.feel.includes("nothing"))add("nothing");
if(me.post==="lie")add(M.post==="lie"?"slieM":"slie","mm");if(me.post==="wave")add("wave");if(me.post==="open"&&front(M.pos)&&front(P.pos))add("open");if(me.post==="spin")add("sspin");
if(me.gaze==="between")add("between");if(me.gaze==="far")add("sfar");if(bothWall)add("swall");
const seen={},out=[];R.forEach(r=>{if(seen[r.id])return;seen[r.id]=1;const d=D[r.id];const f=s=>fill(s.replace("{post}",r.post||""),r.k);out.push({id:r.id,w:PERP.has(r.id)?r.k:"me",c:d.c,p:d.p,g:d.g,s:d.s,t:f(d.t),x:f(d.x),l:d.l.map(f),i:d.i?f(d.i):null})});
return{bad:out.filter(o=>!o.g).sort((a,b)=>b.p-a.p),good:out.filter(o=>o.g)}}
function place(){const sc={o:0,c:0,k:0};QS.forEach((q,i)=>{sc[q.t]+=qScore(i)});const{bad}=decode(),has=id=>bad.some(b=>b.id===id);
if(has("pfront"))sc.o+=3;if(has("small"))sc.o+=2;if(has("pity"))sc.o+=2;if(has("anger"))sc.c+=2;if(S.mm.feel.includes("hurt")||S.pp.feel.includes("hurt"))sc.c+=2;if(has("atme"))sc.c+=1;
const so=Object.entries(sc).sort((a,b)=>b[1]-a[1]);const p=so[0][1]>=2?so[0][0]:"n",p2=p!=="n"&&so[1][1]>=2?so[1][0]:null;
