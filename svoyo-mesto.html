<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своё место — игра Венеры Татиной</title>
<style>
:root{--bg:#162545;--bg2:#1b3058;--box:#1a2d50;--bord:#2a4070;--gold:#c9a84c;--tx:#ddeeff;--dim:#a0bcd8;--red:#3a1a1a;--redl:#c0392b;--grn:#1e3820;--grnl:#3a7d44;--grnt:#a0e0a8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){--bg:#162545}
:root[data-theme="dark"]{--bg:#162545}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:17px/1.5 Calibri,Carlito,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 40px;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fld{position:relative;height:300px;border:1px dashed var(--gold);border-radius:6px;background:radial-gradient(circle at 50% 40%,#1b3058,#12203b);margin:0 0 10px;overflow:hidden;touch-action:none}
.fg{position:absolute;width:62px;height:62px;cursor:grab;touch-action:none;user-select:none}
.fg .arrw{position:absolute;inset:-9px;pointer-events:none}
.fg .arrw:before{content:"";position:absolute;left:50%;top:0;margin-left:-7px;border:7px solid transparent;border-bottom:11px solid var(--gold);border-top:0}
.fg .ci{position:absolute;inset:0;border-radius:50%;background:var(--gold);color:var(--bg);display:grid;place-items:center;font:700 13px Calibri,sans-serif;text-align:center;line-height:1.1;box-shadow:0 0 14px rgba(201,168,76,.35)}
.fg.me .ci{background:#fff}
.fg.on .ci{outline:3px solid var(--tx);outline-offset:2px}
.rotb{display:flex;gap:10px;justify-content:center;margin:0 0 6px}.rotb button{width:54px;height:44px;font-size:22px;border-radius:50%;border:0;background:var(--gold);color:var(--bg);cursor:pointer}
.wrap:before,.wrap:after{content:"";position:fixed;width:26px;height:26px;border:2px solid var(--gold);pointer-events:none;opacity:.8}
.wrap:before{top:calc(10px + env(safe-area-inset-top,0px));left:10px;border-right:0;border-bottom:0}
.wrap:after{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px;border-left:0;border-top:0}
h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--gold);line-height:1.2;margin:0 0 12px}
h1{font-size:34px;text-align:center}h2{font-size:25px}
.badge{display:block;width:fit-content;margin:0 auto 18px;border:1px solid var(--gold);background:var(--bg2);color:var(--gold);padding:4px 14px;font-size:13px;font-weight:700;letter-spacing:.06em}
.bar{display:flex;gap:5px;margin:0 0 20px}.bar i{flex:1;height:4px;background:var(--bord);border-radius:2px}.bar i.on{background:var(--gold)}
.div{display:flex;align-items:center;gap:10px;color:var(--gold);margin:14px 0}.div:before,.div:after{content:"";flex:1;height:1px;background:var(--gold);opacity:.5}
p{margin:0 0 12px}.dim{color:var(--dim)}
.box{background:var(--box);border:1px solid var(--bord);border-left:5px solid var(--gold);padding:14px 16px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--box);border:1px solid var(--bord);color:var(--tx);font:inherit;padding:13px 15px;margin:0 0 9px;cursor:pointer;border-radius:4px}
.opt:hover{border-color:var(--gold)}.opt.sel{border-color:var(--gold);background:var(--bg2);box-shadow:inset 4px 0 var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.chip{flex:1 1 auto;min-width:46%;text-align:center;margin:0}
.btn{display:block;width:100%;background:var(--gold);color:var(--bg);border:0;font:700 18px Georgia,serif;padding:14px;margin-top:16px;cursor:pointer;border-radius:4px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
textarea{width:100%;background:var(--box);border:1px solid var(--bord);color:var(--tx);font:inherit;padding:12px;border-radius:4px;margin:0 0 12px}
.note{background:var(--grn);border:1px solid var(--grnl);color:var(--grnt);padding:11px 14px;margin:6px 0 12px;border-radius:4px}
.warn{background:var(--red);border:1px solid var(--redl);color:#f0a0a0;padding:11px 14px;margin:6px 0 12px;border-radius:4px}
.fig{font-weight:700;color:var(--gold);margin:0 0 6px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}.pos .opt{margin:0;text-align:center;padding:10px 6px;font-size:15px}
.sl{margin:0 0 18px}.sl label{display:flex;justify-content:space-between;margin-bottom:4px}.sl input{width:100%;accent-color:#c9a84c}
.hold{width:170px;height:170px;border-radius:50%;margin:20px auto;display:grid;place-items:center;font:700 18px Georgia,serif;color:var(--tx);border:0;cursor:pointer;touch-action:none;user-select:none;background:conic-gradient(var(--gold) 0deg,var(--bord) 0deg)}
.hold span{background:var(--bg);width:146px;height:146px;border-radius:50%;display:grid;place-items:center;padding:10px}
.phrase{font:italic 700 22px/1.4 Georgia,serif;color:var(--gold);margin:6px 0 14px;text-align:center}
.res{font-size:16px;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease}@keyframes f{from{opacity:0}to{opacity:1}}}
</style>
</head>

<script>
const LOY={
copy:{n:"Я как ты",need:"повторять твою судьбу",what:"Ты повторяешь путь мамы, папы или предка: так принадлежишь своему роду.",money:"Деньги идут по сценарию рода: сколько было у родителей, столько и удерживается.",rel:"Повторяются те же партнёры и те же истории, что были у мамы или папы.",body:"Те же болезни и те же возрасты, что в роду по линии мамы или бабушки.",ask:"Кто в роду был несчастлив в браке или жил так же, как ты сейчас?",ph:"Мама, я вижу твою судьбу. Я оставляю тебе твою судьбу. А свою жизнь я выбираю прожить по-другому."},
instead:{n:"Я вместо тебя",need:"нести твою боль",what:"Ты берёшь на себя чужую судьбу и чужую боль: «я болею, чтобы ты могла жить».",money:"Силы и деньги уходят на чужие проблемы, на свою жизнь не остаётся.",rel:"Ты растворяешься в партнёре или семье и теряешь себя.",body:"Болезнь и усталость как способ нести чужое.",ask:"Чью боль или болезнь из рода ты несёшь вместо кого-то?",ph:"У тебя отдельная судьба. У меня отдельная судьба. Я остаюсь в своей жизни."},
better:{n:"Лучше я, чем ты",need:"тащить за тебя твою ношу",what:"Ты берёшь чужую ответственность и чужой крест: «пусть я, лишь бы тебе было легче».",money:"Ты тянешь семью и долги на себе, а деньги приходят и уходят на других.",rel:"Ты всё тянешь одна, партнёр расслабляется и не берёт ответственность.",body:"Хроническая усталость: энергия уходит на удержание чужого.",ask:"Кто в роду всё тащил на себе и кого ты стремишься облегчить?",ph:"Ты справишься. У тебя есть сила. Я возвращаю тебе твою."},

guilt:{n:"Успех через вину",need:"страдать вместе с тобой",what:"Ты связываешь своё счастье с чужой неудачей: «раз ты страдал, мне тоже нельзя».",money:"После успеха приходят потери: поле выравнивает вину деньгами.",rel:"Счастье в отношениях вызывает вину перед мамой или папой.",body:"Болезни и срывы именно тогда, когда всё начинает получаться.",ask:"Кто в роду страдал, пока тебе хочется, чтобы стало хорошо?",ph:"Я вижу вашу боль. И выбираю жить с любовью и лёгкостью. Это не против вас. Это благодаря вам."},
poor:{n:"Нехватка, как у предков",need:"жить в нехватке, как жили вы",what:"Деньги «жгут руки»: убеждение, что хотеть большего значит предать тех, у кого не было.",money:"Деньги уходят сразу, как приходят: траты появляются после прихода дохода.",rel:"Хватит и малого: ты не просишь и не принимаешь больше.",body:"Усталость и ощущение «не заслужила».",ask:"Кто в роду постоянно жил в нехватке?",ph:"Я могу больше. Это не предательство. Мой достаток уважает путь рода."},
pain:{n:"Успех через страдание",need:"добывать всё через боль",what:"Внутри живёт установка, что деньги и любовь достаются только через труд и боль.",money:"Ты работаешь много, получаешь мало, и вина, если стало легко.",rel:"Любовь связана с борьбой, спокойные отношения кажутся «ненастоящими».",body:"Работа на износ и выгорание при хорошем доходе.",ask:"Кто в роду всё добывал тяжёлым трудом и страданием?",ph:"Мне можно получать без боли. Любовь не требует страдания."},
par:{n:"Нельзя превзойти маму или папу",need:"не быть счастливее и успешнее тебя",what:"Из страха «предать» ты тормозишь свой рост и повторяешь их ошибки.",money:"Ты не позволяешь себе стать успешнее мамы или папы.",rel:"Сильный партнёр «делает слабым» папу, и рядом выбирается тот, кто «не дотягивает».",body:"Рост и видимость сопровождаются телесным откатом.",ask:"Чью судьбу из родителей ты боишься превзойти?",ph:"Мама, папа, я вижу, как сложилась ваша жизнь. Я уважаю ваш путь. А свою реализацию я беру себе."},
marr:{n:"Или семья, или деньги",need:"выбирать между семьёй и деньгами",what:"Сценарий «или семья, или деньги»: страх, что успех разрушит отношения.",money:"Стеклянный потолок именно тогда, когда дела идут хорошо.",rel:"Страх зарабатывать больше партнёра, страх, что успех разрушит пару.",body:"Напряжение в теле, когда доход растёт.",ask:"Кто в роду потерял семью или деньги, когда пошёл вверх?",ph:"У него своя система денег. У меня своя. Это не нарушает нашу гармонию, а усиливает её. Мне можно иметь и деньги, и любовь."},
hide:{n:"Не высовываться",need:"не высовываться",what:"Часть тебя уверена, что быть заметной опасно: могут осудить, позавидовать, отвергнуть.",money:"Ты занижаешь цену, откладываешь проявленность и стесняешься называть сумму.",rel:"Ты подстраиваешься и сжимаешься рядом с теми, кто «громче».",body:"Зажимы в горле и спине, когда нужно проявиться.",ask:"Кто в роду пострадал за то, что высунулся?",ph:"Я могу быть видимой и проявленной. Это не предательство моего рода."},

function l8(){if(!S.fig8)S.fig8={gm1:{x:.15,y:.5,a:0},gf1:{x:.38,y:.5,a:0},gm2:{x:.62,y:.5,a:0},gf2:{x:.85,y:.5,a:0},me:{x:.15,y:.82,a:0},mm:{x:.38,y:.82,a:0},pp:{x:.62,y:.82,a:0},rq:{x:.85,y:.82,a:0}};S.moved=0;S.sel=null;
return `<span class="badge">ФИНАЛ · ВЗГЛЯД НА СВОЮ ЖИЗНЬ</span><h2>Куда ты смотришь?</h2><p class="dim">Расставь всех, как чувствуешь: ты, мама, папа, бабушки, дедушки и твой запрос («${esc(S.area)}»). Куда они стоят и куда смотрят? Выбери фигуру и поверни её стрелками.</p><div id="fld" style="height:380px">${Object.keys(NAMES).map(k=>`<div class="fg ${k==="me"?"me":""}" id="f_${k}" role="button" aria-label="${NAMES[k]}"><div class="arrw"></div><div class="ci">${NAMES[k]}</div></div>`).join("")}</div><div class="rotb"><button id="rl" aria-label="Повернуть влево">⟲</button><button id="rr" aria-label="Повернуть вправо">⟳</button></div><button class="btn" id="bf" disabled onclick="read8()">Считать поле</button><div id="an8"></div><div id="demo8" style="display:none"><div id="demob"><div class="box" id="cap8">Нажми, чтобы увидеть, как это бывает в жизни.</div><button class="btn ghost" onclick="anim(ESC);cap('Мы разворачиваемся к претензиям, к родителям, бабушкам и дедушкам. Любим их учить и убегаем на чужие места. Тогда мы стоим спиной к своей жизни: к деньгам, отношениям, здоровью.')">Покажи, как мы убегаем</button><button class="btn ghost" onclick="anim(IDEAL);cap('Чтобы идти в жизнь, мы смотрим вперёд, на свой запрос. Род стоит сзади и передаёт силу через плечи. Это и значит занять своё место.')">Покажи, как это работает</button></div><div id="vbox" class="box" style="display:none;margin-top:14px"><div class="fig">Объяснение Венеры</div><audio id="va" controls preload="metadata" style="width:100%"></audio><video id="vv" controls playsinline preload="metadata" style="width:100%;display:none;margin-top:8px"></video></div><div class="box" style="border-left-color:#a98cff">Это только твой первый взгляд. Что стоит за ним в твоём роду и как развернуться к своей жизни, видно на разборе. Посмотри своё заключение, там мы собрали твой вопрос.</div><button class="btn" onclick="go(9)">Моё заключение</button></div>`}
function cap(t){document.getElementById('cap8').textContent=t}
function anim(T){const ks=Object.keys(T),from={};ks.forEach(k=>from[k]={...S.fig8[k]});const t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/1400),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;ks.forEach(k=>{const a=S.fig8[k],b=from[k],c=T[k];a.x=b.x+(c.x-b.x)*e;a.y=b.y+(c.y-b.y)*e;a.a=b.a+nrm(c.a-b.a)*e;window._pl&&window._pl(k)});if(p<1)requestAnimationFrame(f)})(t0)}
function read8(){const f=document.getElementById('fld'),W=f.clientWidth,H=f.clientHeight,F=S.fig8,me=F.me;const ang=(a,b)=>Math.atan2((b.x-a.x)*W,-(b.y-a.y)*H)*180/Math.PI,rel=o=>nrm(ang(me,o)-me.a);const A=['mm','pp','gm1','gf1','gm2','gf2'];
const ahead=A.filter(k=>Math.abs(rel(F[k]))<60),away=A.filter(k=>Math.abs(nrm(F[k].a-ang(F[k],me)))>110),qb=Math.abs(rel(F.rq))>=120,qf=Math.abs(rel(F.rq))<60,t=[];
