.offer{border-left-color:var(--vio)}
details summary{cursor:pointer;color:var(--gold);font-weight:700}
.res{white-space:pre-wrap;font-size:15px}

.room{font:18px/1.45 Georgia,serif;color:var(--tx);margin:0 0 10px}
.find{background:var(--box);border:1px solid var(--bord);border-left:5px solid var(--redl);border-radius:6px;padding:14px 16px;margin:0 0 12px}

</style>

pfront1:{c:"p1",p:90,t:"Ты встала выше {G}",x:"Ты смотришь на {A} сверху: оцениваешь, учишь, ждёшь, что {she} изменится. Сила от {G} до тебя не доходит, и опору приходится создавать самой.",l:["Доказываешь миру и себе, что справишься сама","Трудно принимать помощь и подарки","Живёшь на износ, жизнь теряет лёгкость"],i:"«Если я расслаблюсь — всё рухнет»"},
ideal:{c:"id",p:10,g:1,t:"Мама и папа за твоими плечами",x:"Это правильный порядок: папа за правым плечом даёт силу и решительность, мама за левым — тепло и принятие. За ними весь твой род. Ты смотришь вперёд, в свою жизнь.",l:["Чувство защищённости: «со мной сила моего рода»","Путь вперёд естественный и безопасный","Видишь возможности и выбираешь их без страха"],i:"«Я не одна, за мной стоят большие»"},
swap:{c:"sw",p:60,t:"Мама и папа поменялись местами",x:"Это путаница ролей в семье. Она отражается на деньгах и на отношениях с мужчинами.",l:["В паре непонятно, кто опора","Деньги идут не туда, где нужны"],i:null},
far:{c:"fa",p:80,t:"{N} далеко от тебя",x:"Связь с {I} разорвана: старая обида, боль или привычка держать дистанцию, чтобы не было больно. Без этой связи ты как будто без корней.",l:["Мало внутренней опоры: уверенность, деньги и карьера держатся на усилии","Выбираешь партнёров, которые недоступны или уходят","Одиночество даже среди людей, страх потерять близких"],i:null},
side_mm:{c:"ms",p:70,t:"Мама смотрит мимо тебя",x:"Мамино внимание было занято не тобой: её болью, мыслями, другой жизнью. Отсюда убеждение, что любовь нужно заслужить, а счастье всегда где-то потом.",l:["В отношениях дистанция, партнёр чувствует холод","Высокие планки: требуешь от себя идеала и не принимаешь помощь","Радость откладываешь: «сначала добьюсь, потом буду счастлива»","Внутри: «со мной что-то не так», страх показаться слабой"],i:"«Чтобы получить любовь, её нужно заслужить»"},
away_pp:{c:"pa",p:70,t:"Папа не смотрит на тебя",x:"Канал мужской силы рода как будто перекрыт: «меня не видят». Опора на мужчину и на мир кажется ненадёжной.",l:["Деньги приходят, но легко утекают; мало смелых больших решений","Мало уверенности в переговорах и лидерстве","Эмоционально отстранённые партнёры, поиск признания у начальников","Трудно доверять мужчинам и миру"],i:"«Мужчина не присутствует рядом. Опора ненадёжна»"},
nolook:{c:"nl",p:75,t:"Мама и папа не смотрят на тебя",x:"Ты не чувствуешь, что за тобой есть поддержка: поток силы рода как будто оборван. Поэтому ты всё время ищешь, чем заполнить пустоту.",l:["Гонка за целями и деньгами, радость от достигнутого быстро исчезает","Ждёшь, что партнёр или дети закроют пустоту, отсюда напряжение и претензии","Покупки, поездки, новые отношения дают облегчение ненадолго"],i:"«Я одна»"},
eachother:{c:"eo",p:72,t:"Мама и папа смотрят друг на друга",x:"Между родителями был нерешённый конфликт, их внимание было друг на друге, а не на тебе. Поэтому отношения мужчины и женщины для тебя связаны с борьбой.",l:["Отношения быстро переходят в ссоры","Ждёшь подвоха или предательства от партнёра","Спокойствие в паре кажется непривычным, и хорошие отношения хочется разрушить"],i:"«Чтобы меня любили, нужно страдать или бороться»"},
mboth:{c:"mb",p:65,t:"Мама смотрит и на папу, и на тебя",x:"Мама искала опору не только в папе, но и в тебе. Ты бессознательно соревнуешься с папой за мамино внимание.",l:["Соперничество с партнёром или коллегами","«Опоры нет, я сама»: недоверие к мужчинам","Трудно просить помощь и делегировать, отсюда выгорание"],i:"«Чтобы меня любили, я должна быть нужнее, чем папа»"},
atme:{c:"am",p:85,t:"Ты в центре внимания мамы и папы",x:"Это нарушение порядка: ты стоишь как будто выше них, всё держится на тебе, а внутри живёт претензия к родителям.",l:["Выгорание и хроническая усталость","Деньги приходят тяжело и быстро уходят; кредиты, чтобы доказать силу","Борьба за признание, сценарии борьбы в отношениях","Претензии переходят на партнёров, начальников, людей вокруг"],i:"«Вы должны были дать больше»"},
down:{c:"dn",p:88,s:1,t:"{N} смотрит в пол",x:"В судьбе {G} есть тяжёлая непрожитая история или потеря, которую ещё не увидели и не почтили. Ты бессознательно несёшь эту тяжесть.",l:["Деньги приходят и быстро уходят","Страх близости: «если сближусь — потеряю»","Беспричинная тяжесть, тревога"],i:"«Я не имею права быть счастливой, пока там боль»"},
sitlie:{c:"sl",p:87,s:1,t:"{N} {post}: силы не в жизни",x:"У {G} нет сил на жизнь, и эта тяжесть вытягивает силу и радость из всей семьи, в том числе из тебя.",l:["Сонливость, усталость, нет желаний и мотивации","Чувство пустоты","Не складывается работа, рушатся планы, отношения нестабильны"],i:null},
wob:{c:"wb",p:68,t:"{N} шатается: у {G} не было опоры",x:"У {G} самой не было внутренней опоры, и ты переняла это состояние: мир кажется ненадёжным, будто почва уйдёт из-под ног.",l:["Деньги: колебания, страх начинать новое, нестабильный доход","Поиск надёжной опоры вовне, страх потерять поддержку","Тревога и неуверенность"],i:null},
wall:{c:"wl",p:66,t:"{N} опирается на стену",x:"{N} сам{la} не чувствовал{la} поддержки в жизни и не мог{lo} дать тебе безопасность. Отсюда ощущение «мне негде опереться».",l:["Ищешь опору вовне: в партнёре, работе, статусе","Сомнения и страх перед важными шагами","Подпираешь жизнь контролем, долгами, сверхусилиями"],i:"«Опора только в себе, помощи ждать неоткуда»"},
lean:{c:"ld",p:64,t:"Мама опирается на папу",x:"Мама недополучила любви от своих родителей и искала в муже не партнёра, а родителя. Ты повторяешь это: ищешь в мужчине того, кто спасёт и защитит.",l:["Зависимые отношения: спасение и перекладывание ответственности","Страх принимать решения самой","Разочарования: партнёр не может заменить родительскую любовь"],i:"«Только сильный партнёр даст мне стабильность»"},
spin:{c:"sp",p:62,t:"{N} кружится: ищет своё место",x:"В семье нарушен порядок, и {n} «не знает», где {herD} стоять. Ты тоже ищешь своё место.",l:["Трудно определиться с работой, партнёром, городом","Чувство «нигде нет моего дома»","Частая смена работы, отношений, проектов"],i:null},
door:{c:"dr",p:67,t:"{N} смотрит в дверь или окно",x:"Внимание {G} было вне семьи: в прошлом, в других связях, в несбывшихся мечтах. Отсюда чувство, что в любой момент кто-то уйдёт.",l:["Нестабильность: «в любой момент кто-то уйдёт»","Удерживаешь любовь любой ценой или уходишь первой","Счастье всегда где-то «там, за окном»"],i:"«Он здесь не до конца»"},
through:{c:"th",p:69,t:"{N} смотрит сквозь тебя",x:"{N} видит не тебя, а свои ожидания и несбывшиеся надежды. Ты рано стала «взрослым ребёнком» и привыкла заслуживать.",l:["Партнёры, перед которыми снова нужно доказывать ценность","Работа на износ ради признания","Убеждение, что без достижений тебя не заметят"],i:"«Чтобы меня любили, я должна быть идеальной»"},
gfar:{c:"gf",p:55,t:"{N} смотрит вдаль",x:"Фокус на будущем, а в настоящем нет полноты. Ты переняла: сначала добейся, потом будешь счастлива.",l:["Радость, отдых, отношения — всё «потом»","Вечная нехватка времени и сил","Радость от цели быстро исчезает"],i:"«Вот когда достигну — тогда начну жить»"},
small:{c:"sm",p:82,t:"{N} {sm}: ты стала {herD} родителем",x:"Ты взяла на себя заботу и ответственность за {A} не по возрасту. Ребёнок не может быть больше родителя: это лишает силы тебя саму.",l:["Режим выживания: работа без отдыха, всё под контролем","Трудно принимать помощь; партнёры, которых снова нужно спасать","«Я много делаю, но результата нет»"],i:null},
clear:{c:"cl",p:78,t:"{N} {cl}: опоры не было",x:"У тебя нет внутреннего чувства, что {n} — источник силы. Вроде рядом, но эмоционально {nd}.",l:["Трудно доверять людям и сближаться","Не просишь помощи, всё решаешь сама","Нет ощущения дома, достижения не радуют"],i:"«Я никому не нужна. Я сама по себе»"},
big:{c:"bg",p:5,g:1,t:"{N} {bg} — это порядок",x:"Родители большие, а ты маленькая перед ними. Так сила рода может идти к тебе.",l:[],i:null},
sad:{c:"sd",p:63,t:"{sd} {n}: ты несёшь {her} боль",x:"Ты чувствуешь судьбу {G} слишком глубоко и берёшь {her} грусть на себя. Любить можно через принятие, а не через повторение.",l:["Работа без радости, ощущение пустоты","Вина за счастье: «как я могу радоваться, если {n} страдал{la}?»","Внутренний запрет на удовольствие и лёгкость"],i:"«Если я тоже буду грустной, я буду ближе»"},
strict:{c:"st",p:61,t:"Строгий взгляд {G}: жизнь под контролем",x:"Ты видишь {A} не как источник силы, а как строгого судью. Отсюда страх ошибок и нерешительность.",l:["Страх заявлять о себе, заниженные цели","Ждёшь осуждения и контроля от партнёра","Срыв проектов и уход денег"],i:"«Меня всё время оценивают»"},
eval:{c:"ev",p:60,t:"Оценивающий взгляд {G}: жизнь как экзамен",x:"Ты усвоила, что твоя ценность зависит от оценки. Любовь и признание нужно постоянно заслуживать.",l:["Синдром отличницы, жизнь «под проверкой»","Успехи кажутся недостаточными","Страх, что большие деньги вызовут ещё больше критики"],i:"«Ты недостаточно хороша»"},
cover:{c:"cv",p:86,s:1,t:"{N} закрывает лицо руками",x:"В судьбе {G} есть глубокая боль или стыд. Это не из-за тебя, а из-за {her} собственной жизни. А ты пытаешься доказать, что ты есть.",l:["Доказываешь, что ты есть: через достижения или через проблемы","Партнёры, которые тебя не видят","Деньги приходят, но не радуют"],i:"«Я должна справляться сама, раз на меня не могут смотреть»"},
anger:{c:"an",p:84,t:"Злость на {A} перекрывает поток",x:"Злость на {A} отсекает тебя от силы рода. Энергия, которая должна идти на деньги, успех и радость, уходит на внутреннюю борьбу.",l:["Деньги приходят с усилием, доход нестабилен","Конфликты и недоверие в отношениях","Усталость, обида; снова и снова нужно доказывать свою ценность"],i:null},
pity:{c:"pt",p:81,t:"Жалость к {D}: ты стала больше {G}",x:"Жалость ставит тебя выше {G}. Это иллюзия силы: сила идёт только от старших к младшим, и жалость перекрывает этот поток.",l:["Притягиваешь «слабых» партнёров, чтобы снова быть сильной","Всё держится на тебе, отсюда выгорание","Снаружи «у меня всё прекрасно», внутри усталость и одиночество"],i:"«Со мной всё в порядке»"},
nothing:{c:"nt",p:76,t:"«Ничего не чувствую»: не было близости",x:"Это не ненависть, а отсутствие эмоциональной близости. Родители были рядом, но заняты работой, проблемами, выживанием, и тепло в семье не показывали.",l:["Эмоциональная заморозка, партнёр чувствует недоступность","«Я сама» как маска страха зависимости","Обесцениваешь свои успехи и праздники"],i:"«Связь не чувствуется»"},
love:{c:"lv",p:4,g:1,t:"К {D} у тебя тепло и любовь",x:"Это твой ресурс: через любовь к {D} к тебе может идти сила рода.",l:[],i:null},
slie:{c:"yl",p:98,s:1,t:"Ты лежишь: силы не в жизни",x:"Ты как будто не встаёшь в свою жизнь. Часто это любовь: лечь рядом с кем-то из рода и разделить его тяжесть.",l:["Тупик, апатия, остановка","Повторяются сценарии остановки и неудач"],i:null},
slieM:{c:"ym",p:99,s:1,t:"Ты легла рядом с мамой",x:"Мама без сил, и часть тебя из любви легла рядом, чтобы быть ближе и разделить её судьбу. Эта верность удерживает тебя от своей жизни.",l:["Бездействие как способ разделить чужую боль","Печаль останавливает энергию жизни"],i:"«Из любви к тебе я легла рядом»"},
wave:{c:"wv",p:74,t:"Ты машешь им: «заметьте меня»",x:"Тебе не хватало внимания и тепла, и до сих пор живёт надежда достучаться до родительской любви.",l:["Внимание через успехи и яркость или через болезни, долги, конфликты","Партнёры, из которых нужно «вытягивать» внимание","Усталость от постоянного доказывания"],i:"«Посмотрите на меня. Заметьте меня»"},
open:{c:"op",p:73,t:"Руки раскрыты к ним: ты ищешь признания",x:"Ты всё ещё связана с динамикой родителей и тянешься к ним: «заметьте меня». За яркостью стоит голод по любви.",l:["Яркая, заметная, много делаешь для других, чтобы заслужить внимание","Внутри: «меня не видят, не принимают просто так»"],i:"«Я пытаюсь достучаться до вас»"},
between:{c:"bt",p:79,t:"Ты смотришь между мамой и папой",x:"Ты не видишь родителей целиком: «смотреть прямо не буду, но и отвернуться не могу». За этим скрытая вина.",l:["Снова и снова ситуации, где чувствуешь вину: долги, ссоры","Обстоятельства, после которых думаешь «я плохая мать, жена, дочь»"],i:"«Если я буду счастлива, я предам их боль»"},
sfar:{c:"yf",p:54,t:"Ты смотришь вдаль: жизнь «потом»",x:"Твой фокус в будущем, а в настоящем нет полноты. Внутри: сначала добейся, потом заслужишь счастье.",l:["Отдых, радость, отношения — всё «после»","Хроническая усталость и нехватка времени"],i:"«Вот когда стану успешной — тогда начну жить»"},
swall:{c:"sw2",p:77,t:"Родители у стены, ты смотришь в стену",x:"У родителей не было дороги вперёд, и ты повторяешь их судьбу: «раз у вас не получилось, то и у меня нет пути».",l:["Доход упирается в потолок","Партнёрство кажется небезопасным","Апатия: «я в тупике, выхода нет»"],i:"«Я не могу быть счастливой, если у вас не получилось»"},
sspin:{c:"ys",p:62,t:"Ты кружишься: ищешь своё место",x:"Ты не знаешь, где тебе стоять: колеблешься между ролями, занимаешь чужие места.",l:["Трудно определиться с работой, партнёром, городом","Частая смена работы, отношений, проектов"],i:null}};

/* ----- схема поля (вид сверху) ----- */
const PXY={front:[50,20],fl:[27,26],fr:[73,26],sl:[16,55],sr:[84,55],bl:[36,82],br:[64,82],b:[50,88]},ME=[50,55];
const COL={mm:"#e0b85a",pp:"#c9a84c",me:"#ffffff",rod:"#bfae84",mon:"#5fd08a",rlz:"#7fc8ff",kids:"#9be7ff",prt:"#ff8fb1"};
const angTo=(a,b)=>Math.atan2(b[0]-a[0],-(b[1]-a[1]))*180/Math.PI;
const cl=v=>Math.max(14,Math.min(86,v));
function ppos(k){const X=S[k];if(!X.pos)return null;let[x,y]=PXY[X.pos];const o=S[k==="mm"?"pp":"mm"];if(o.pos===X.pos)x+=k==="mm"?-10:10;const f=X.dist==="far"?1.5:X.dist==="near"?.7:1;return[cl(ME[0]+(x-ME[0])*f),cl(ME[1]+(y-ME[1])*f)]}
function arrow(p,a,L,dash,col){L*=1.35;{const r0=a*Math.PI/180;p=[p[0]+Math.sin(r0)*6,p[1]-Math.cos(r0)*6]}const r=a*Math.PI/180,x2=p[0]+Math.sin(r)*L,y2=p[1]-Math.cos(r)*L,h=2.4,l=a*Math.PI/180;const hx1=x2-Math.sin(l-.5)*h,hy1=y2+Math.cos(l-.5)*h,hx2=x2-Math.sin(l+.5)*h,hy2=y2+Math.cos(l+.5)*h;return `<line x1="${p[0]}" y1="${p[1]}" x2="${x2}" y2="${y2}" stroke="${col||"#c9a84c"}" stroke-width=".9" ${dash?'stroke-dasharray="1.6 1.2"':""}/><polygon points="${x2},${y2} ${hx1},${hy1} ${hx2},${hy2}" fill="${col||"#c9a84c"}"/>`}
function person(p,col,post,sc,op,lab,glyph){sc=(sc||1)*1.45;let b="",rot=0;const head=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="2.9" fill="${col}"/>`;
if(post==="lie")b=`<ellipse cx="1.5" cy="0" rx="5.6" ry="2.4" fill="${col}"/>`+head(-5.8,0);
else if(post==="sit")b=head(0,-3.5)+`<path d="M-3.8 3 Q-3.8 -.6 0 -.6 Q3.8 -.6 3.8 3 Z" fill="${col}"/><line x1="-5" y1="3.6" x2="5" y2="3.6" stroke="${col}" stroke-width=".8"/>`;
else{b=head(0,-5.2)+`<path d="M-3.8 4.8 Q-3.8 -1.6 0 -1.6 Q3.8 -1.6 3.8 4.8 Z" fill="${col}"/>`;if(post==="wob"||post==="wave"||post==="lean")rot=post==="lean"?-12:14;}
let ex="";if(post==="wall")ex=`<line x1="-6.5" y1="-9" x2="-6.5" y2="6" stroke="#8aa0c0" stroke-width="1.4"/>`;if(post==="spin")ex=`<circle r="8" fill="none" stroke="${col}" stroke-width=".5" stroke-dasharray="2 1.5"/>`;if(post==="wob")ex=`<text x="6" y="-3" font-size="4" fill="${col}">≈</text>`;if(post==="wave")ex=`<text x="4" y="-6" font-size="4">👋</text>`;if(post==="open")ex=`<path d="M-6 -2 L-3.8 0 M6 -2 L3.8 0" stroke="${col}" stroke-width="1"/>`;
if(glyph)ex+=`<text x="0" y="3.6" text-anchor="middle" font-size="3.6" font-weight="700" fill="#162545">${glyph}</text>`;
return `<g transform="translate(${p[0]} ${p[1]}) scale(${sc})" opacity="${op||1}"><g transform="rotate(${rot})">${b}</g>${ex}</g>`+(lab?`<text x="${p[0]}" y="${p[1]+8.5*sc+1}" text-anchor="middle" font-size="3.3" font-weight="700" fill="#fff" stroke="#0a1430" stroke-width=".6" paint-order="stroke">${lab}</text>`:"")}
function pgaze(k,p){const X=S[k],m=ME,o=ppos(k==="mm"?"pp":"mm");const tm=angTo(p,m);switch(X.gaze){case"me":return arrow(p,tm,9);case"other":return o?arrow(p,angTo(p,o),8):"";case"both":return arrow(p,tm,9)+(o?arrow(p,angTo(p,o),8):"");case"side":return arrow(p,tm+90,8);case"away":return arrow(p,tm+180,8);case"far":return arrow(p,tm+180,14,1);case"door":{const a=p[0]<50?270:90;return arrow(p,a,12,1)+`<rect x="${a===90?96:1}" y="${p[1]-5}" width="3" height="10" fill="#8aa0c0"/>`}case"through":return arrow(p,tm,22,1);case"down":return `<text x="${p[0]+5}" y="${p[1]+4}" font-size="3.4" fill="#f3b0a8">↓ в пол</text>`}return""}
function roomSVG(){let s="";const mp=ppos("mm"),pp=ppos("pp");
[["mm",mp],["pp",pp]].forEach(([k,p])=>{if(!p)return;const X=S[k];s+=pgaze(k,p)+person(p,COL[k],X.post,X.size==="small"?.72:X.size==="big"?1.3:1,X.size==="clear"?.35:1,NOUN[k].N)});
const g=S.me.gaze;let a=null,L=9,d=0;if(g==="mm"&&mp)a=angTo(ME,mp);if(g==="pp"&&pp)a=angTo(ME,pp);if(g==="between"&&mp&&pp)a=angTo(ME,[(mp[0]+pp[0])/2,(mp[1]+pp[1])/2]);if(g==="fwd")a=0;if(g==="side")a=90;if(g==="far"){a=0;L=16;d=1}if(g==="wall")a=270;if(g==="away"){const t=mp&&pp?[(mp[0]+pp[0])/2,(mp[1]+pp[1])/2]:[50,10];a=angTo(ME,t)+180}
if(a!==null)s+=arrow(ME,a,L,d,"#ffffff");if(g==="wall")s+=`<line x1="4" y1="40" x2="4" y2="70" stroke="#8aa0c0" stroke-width="1.6"/>`;if(g==="down")s+=`<text x="55" y="60" font-size="3.4" fill="#f3b0a8">↓ в пол</text>`;
s+=person(ME,COL.me,S.me.post,1,1,"Я");return svgWrap(s)}
const svgWrap=s=>`<svg viewBox="0 -10 100 116" class="sch" role="img" aria-label="Схема поля"><circle cx="50" cy="55" r="40" fill="none" stroke="rgba(201,168,76,.18)" stroke-dasharray="1 2"/>${s}</svg>`;
function lifeLayout(p,ideal){const L=S.life,items=["mon","rlz"].concat(L.kids==="yes"?["kids"]:[]).concat(L.prt&&L.prt!=="no"?["prt"]:[]);const F=[];const lab={mon:"Деньги",rlz:"Моё дело",kids:"Дети",prt:"Партнёр"},gl={mon:"₸",rlz:"★",kids:"✿",prt:"♥"};const behind=[];
if(p==="n"||ideal){F.push({k:"me",x:50,y:52,a:0,sc:1});F.push({k:"mm",x:38,y:72,a:0},{k:"pp",x:62,y:72,a:0},{k:"rod",x:50,y:87,a:0});
const front={mon:[24,20],rlz:[76,20],kids:[50,26],prt:[71,52]},back={mon:[22,90],rlz:[78,90]};items.forEach(k=>{const bad=!ideal&&((k==="mon"&&(L.mon||[]).some(x=>["tight","debt","flow"].includes(x)))||(k==="rlz"&&["delay","lost"].includes(L.rlz)));const q=bad?back[k]:front[k];if(bad)behind.push(lab[k]);F.push({k,x:q[0],y:q[1],a:0,lab:lab[k],gl:gl[k]})})}
else{const sm=p==="o"?.75:p==="k"?1.3:1,ms=p==="o"?1.15:p==="k"?.72:1;F.push({k:"me",x:50,y:46,a:180,sc:ms});F.push({k:"mm",x:38,y:72,a:0,sc:sm},{k:"pp",x:62,y:72,a:0,sc:sm},{k:"rod",x:50,y:89,a:0});
const pos={mon:[22,18],rlz:[78,18],kids:[50,16],prt:[87,38]};items.forEach(k=>{behind.push(lab[k]);F.push({k,x:pos[k][0],y:pos[k][1],a:k==="prt"?90:0,lab:lab[k],gl:gl[k]})})}

function lifeSVG(p,ideal){const{F}=lifeLayout(p,ideal);let s="";F.forEach(f=>{const pt=[f.x,f.y];if(["me","mm","pp"].includes(f.k))s+=arrow(pt,f.a,8,0,f.k==="me"?"#fff":undefined);s+=person(pt,COL[f.k],"stand",f.sc||1,1,f.lab||({me:"Я",mm:"Мама",pp:"Папа",rod:"Предки"})[f.k],f.gl)});return svgWrap(s)}

/* ----- расшифровка ----- */
function decode(){const M=S.mm,P=S.pp,me=S.me,R=[];const front=z=>["front","fl","fr"].includes(z);const add=(id,k,extra)=>R.push({id,k:k||"mm",post:extra});
if(front(M.pos)&&front(P.pos))add("pfront");
if(M.pos==="bl"&&P.pos==="br"&&!["mm","pp","between","away"].includes(me.gaze))add("ideal");
if(M.pos==="br"&&P.pos==="bl")add("swap");
const bothWall=M.post==="wall"&&P.post==="wall"&&me.gaze==="wall";
["mm","pp"].forEach(k=>{const X=S[k];if(X.dist==="far")add("far",k);
if(X.post==="sit"||X.post==="lie")add("sitlie",k,X.post==="sit"?"сидит":"лежит");if(X.post==="wob"&&k==="mm")add("wob",k);if(X.post==="wall"&&!bothWall)add("wall",k);if(X.post==="lean")add("lean",k);if(X.post==="spin")add("spin",k);
if(X.gaze==="down")add("down",k);if(X.gaze==="door")add("door",k);if(X.gaze==="through")add("through",k);if(X.gaze==="far")add("gfar",k);if(X.gaze==="both")add("mboth",k);
if(k==="mm"&&["side","away"].includes(X.gaze))add("side_mm",k);
if(X.size==="small")add("small",k);if(X.size==="clear")add("clear",k);if(X.size==="big")add("big",k);
if(X.face==="sad"&&k==="mm")add("sad",k);if(X.face==="strict")add("strict",k);if(X.face==="eval")add("eval",k);if(X.face==="cover")add("cover",k);
if(X.feel.includes("anger"))add("anger",k);if(X.feel.includes("pity")&&k==="pp")add("pity",k);if(X.feel.includes("love"))add("love",k)});
if(M.gaze==="other"&&P.gaze==="other")add("eachother");
if(M.gaze==="me"&&P.gaze==="me")add("atme");
const looks=g=>g==="me"||g==="both"||g==="through";
if(M.gaze&&P.gaze&&!looks(M.gaze)&&!looks(P.gaze)&&!(M.gaze==="other"&&P.gaze==="other"))add("nolook");
else if(["side","away"].includes(P.gaze))add("away_pp","pp");
if(M.feel.includes("nothing")&&P.feel.includes("nothing"))add("nothing");
if(me.post==="lie")add(M.post==="lie"?"slieM":"slie","mm");if(me.post==="wave")add("wave");if(me.post==="open"&&front(M.pos)&&front(P.pos))add("open");if(me.post==="spin")add("sspin");
if(me.gaze==="between")add("between");if(me.gaze==="far")add("sfar");if(bothWall)add("swall");
const seen={},out=[];R.forEach(r=>{if(seen[r.id])return;seen[r.id]=1;const d=D[r.id];const f=s=>fill(s.replace("{post}",r.post||""),r.k);out.push({id:r.id,c:d.c,p:d.p,g:d.g,s:d.s,t:f(d.t),x:f(d.x),l:d.l.map(f),i:d.i?f(d.i):null})});
return{bad:out.filter(o=>!o.g).sort((a,b)=>b.p-a.p),good:out.filter(o=>o.g)}}
function place(){const sc={o:0,c:0,k:0};QS.forEach((q,i)=>{sc[q[0]]+=S.qa[i]||0});const{bad}=decode(),has=id=>bad.some(b=>b.id===id);
if(has("pfront"))sc.o+=3;if(has("small"))sc.o+=2;if(has("pity"))sc.o+=2;if(has("anger"))sc.c+=2;if(S.mm.feel.includes("hurt")||S.pp.feel.includes("hurt"))sc.c+=2;if(has("atme"))sc.c+=1;
const so=Object.entries(sc).sort((a,b)=>b[1]-a[1]);const p=so[0][1]>=3?so[0][0]:"n",p2=p!=="n"&&so[1][1]>=3?so[1][0]:null;
const mine=QS.map((q,i)=>[q,S.qa[i]]).filter(x=>x[1]>0&&(x[0][0]===p||x[0][0]===p2)).sort((a,b)=>b[1]-a[1]).map(x=>x[0][2]);return{p,p2,mine}}

function intro(){return `<span class="badge">К В А Н Т О В Ы Й   В З Л Ё Т</span><h1>Своё место</h1><div class="div">✦</div>${VP}<p class="dim" style="text-align:center">Диагностика жизни от Венеры Татиной. Ты зайдёшь в своё поле, увидишь маму и папу, ответишь на честные вопросы и получишь расшифровку: где ты стоишь на самом деле и что это делает с твоими деньгами, отношениями и здоровьем.</p><div class="box">🎧 Надень наушники и включи звук. Найди 15 минут, когда тебя никто не трогает.</div><div class="box dim">Отвечай не думая, первое, что пришло. Правильных ответов нет.</div><button class="btn glow" onclick="audioStart();go(1)">Начать</button>`}

["pos","dist","post","size","gaze","face","feel"].forEach(f=>window["pk_"+f]=v=>setP(window._k,f,v));

(function(){const c=document.getElementById("bg"),x=c.getContext("2d");let W,H,t=0,mx=.5,my=.5,pulse=0;const dpr=Math.min(2,devicePixelRatio||1),rm=matchMedia("(prefers-reduced-motion: reduce)").matches;

if(rm){for(let i=0;i<160;i++)step()}else{(function loop(){step();requestAnimationFrame(loop)})()}})();
